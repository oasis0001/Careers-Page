<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrainOS — Inside an AI Nerd's Mind</title>
<!-- Bitcount Single → TOKENS panel title · Inter Tight → Automation Flow (falls back to monospace/sans if offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  BrainOS. The ASCII brain core is pulled DIRECTLY from dither_brain.html
  (that file is left untouched): exact rendering, sizing, OrbitControls
  click-drag, camera feel.

  Manifestations (folders / terminal / model card / podcast)
  are HTML elements anchored to fixed 3D points around the brain and re-projected
  to screen space every frame — so they are children of the brain: when you drag
  the brain (orbit the camera) every panel rotates, repositions, rescales and
  changes depth with it, fading away as it passes behind. No wires, no connectors.

  Run via a local server (GLB + ES modules need HTTP):
    python3 -m http.server 8000  →  http://localhost:8000/BrainOS/
-->
<style>
  :root{
    --text:#eef0f6; --muted:#7a7e8c; --muted-2:#4a4d59;
    --panel:#0c0d12; --panel-2:#101218; --border:#1c1d26; --border-hot:#2c3350;
    --blue:#6b9bff; --blue-soft:#8fb0ff; --green:#3dffa3;
    --ease-spring:cubic-bezier(.16,1.3,.3,1); --ease-soft:cubic-bezier(.22,.61,.36,1);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,"Cascadia Code",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#000;                      /* clean, deep black — no grid */
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,"Cascadia Code",monospace;}

  /* the reference control panel — kept (hidden) so the ported brain script runs verbatim */
  #controls{ display:none; }

  /* One shared stacking context for the brain + panels, so a panel can sit IN FRONT OF
     (near side) or BEHIND (far side) the opaque brain canvas. */
  #scene{
    position:fixed; inset:0;
    background:
      radial-gradient(closest-side at 50% 50%, rgba(20,26,44,.45), rgba(0,0,0,0) 70%),
      #000;
  }
  #displayCanvas{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:10;                           /* brain sits between near panels (20) and far panels (5) */
    image-rendering:pixelated;
    max-width:95%; max-height:95%;        /* EXACT sizing from dither_brain.html (intrinsic 1440×750) */
    cursor:grab; touch-action:none;
  }
  #displayCanvas:active{ cursor:grabbing; }

  /* panel layer creates NO stacking context (no z-index) → each panel's z-index competes
     directly with the brain canvas, so far-side panels can drop behind it. */
  #panels{ position:absolute; inset:0; pointer-events:none; }
  .panel{ position:absolute; left:0; top:0; opacity:0; will-change:transform,left,top,opacity;
          transform:translate(-50%,-50%); pointer-events:auto; }

  /* solid cards — fully opaque so the brain never shows through them */
  .card{
    background:linear-gradient(180deg, #13151d, #0a0b10);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    box-shadow:0 16px 46px rgba(0,0,0,.7);
    position:relative; overflow:hidden; transition:border-color .4s, box-shadow .4s, background .4s;
  }
  .panel:hover .card{ border-color:var(--border-hot);
    background:linear-gradient(180deg, #1a1d27, #0d0f15);
    box-shadow:0 26px 74px rgba(0,0,0,.75), 0 0 0 1px rgba(107,155,255,.22), 0 0 40px rgba(107,155,255,.12); }
  .title{ font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--muted);
          display:flex; align-items:center; gap:7px; }
  .dot{ width:6px;height:6px;border-radius:50%; background:var(--muted-2); transition:background .3s, box-shadow .3s; }
  .panel:hover .dot{ background:var(--green); box-shadow:0 0 8px var(--green); }

  /* terminal */
  .term{ width:212px; }
  .term .bar{ display:flex; align-items:center; gap:5px; padding:6px 10px; background:#0c0e12; border-bottom:1px solid var(--border);}
  .term .tl{ width:9px;height:9px;border-radius:50%; }
  .term .tl.r{background:#ff5f56}.term .tl.y{background:#ffbd2e}.term .tl.g{background:#27c93f}
  .term .bar .name{ margin-left:6px; font-size:9.5px; color:var(--muted); }
  .term .scr{ height:120px; overflow:hidden; padding:8px 10px; font-size:10px; line-height:1.5;
              color:var(--green); background:radial-gradient(120% 100% at 0 0,#0a0e0c,#070908); }
  .term .scr .ln{ white-space:pre-wrap; word-break:break-word; }
  .term .scr .ln.sys{ color:#5b7d6e; } .term .scr .ln.ok{ color:#9dffce; }
  .term .scr .cursor{ display:inline-block; width:8px;height:14px; background:var(--green); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{50%{opacity:0}}
  .term-on .card{ box-shadow:0 0 0 1px rgba(61,255,163,.35), 0 0 50px rgba(61,255,163,.18), 0 26px 70px rgba(0,0,0,.6);}

  /* folders — glassy icons exported from Figma (label + glow baked in, transparent bg) */
  /* NB: scoped to `> img` (the folder's OWN icon) so these never leak onto panel images
     nested inside an opened folder (e.g. the Notes editor chrome). */
  .folder{ width:152px; cursor:pointer; user-select:none; }
  .folder > img{ width:152px; display:block; position:relative; z-index:3;   /* icon sits in front; opened panels rise from behind it */
    filter:drop-shadow(0 14px 24px rgba(0,0,0,.4)); transition:transform .45s var(--ease-spring); }
  .folder > img:hover{ transform:translateY(-5px) scale(1.07); }   /* hover the folder → it scales up a bit */

  /* GLASSMORPHISM (cosmetic — the 4 folders only): two panes clipped to each folder's
     OWN silhouette via its PNG used as a CSS mask. Both are pointer-events:none and
     injected once at setup (see addFolderGlass) — they never touch the click / fan logic.
       .fglass  sits BEHIND the icon (z2) → backdrop-blurs the brain so it frosts through
       .fsheen  sits IN FRONT  (z4)       → a soft diagonal light streak + rim, like glass */
  .folder > .fglass, .folder > .fsheen{
    position:absolute; inset:0; pointer-events:none;
    -webkit-mask:var(--mask) center/contain no-repeat;
            mask:var(--mask) center/contain no-repeat;
    transition:transform .45s var(--ease-spring); }   /* track the icon's hover lift */
  .folder > .fglass{ z-index:2;
    -webkit-backdrop-filter:blur(6px) saturate(140%) brightness(1.2);
            backdrop-filter:blur(6px) saturate(140%) brightness(1.2); }
  .folder > .fsheen{ z-index:4;
    background:
      linear-gradient(135deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.06) 24%,
                      rgba(255,255,255,0) 44%, rgba(255,255,255,0) 100%),
      radial-gradient(120% 90% at 26% 12%, rgba(255,255,255,.16), rgba(255,255,255,0) 55%); }
  .folder > img:hover ~ .fglass, .folder > img:hover ~ .fsheen{
    transform:translateY(-5px) scale(1.07); }

  /* shared macOS-window chrome for the Figma panels */
  .win{ border:1px solid #5c5c5c; border-radius:14px; overflow:hidden;
        background:linear-gradient(180deg,#101010 80%, #4a4a4a 220%); }
  .win .tbar{ height:22px; background:#292828; display:flex; align-items:center; gap:5px; padding:0 10px; }
  .win .tbar i{ width:7px; height:7px; border-radius:50%; background:#565656; }
  .win .hd{ display:flex; align-items:center; gap:7px; padding:11px 14px 7px; }
  .win .hd .gdot{ width:7px; height:7px; border-radius:50%; background:#00be6f; box-shadow:0 0 6px #00be6f; flex:none; }
  .win .hd .t{ font-size:16px; font-weight:600; letter-spacing:-0.4px; color:#fff; }
  .panel:hover .win{ border-color:#7d7d7d; box-shadow:0 0 0 1px rgba(0,190,111,.22), 0 0 34px rgba(0,190,111,.12), 0 22px 60px rgba(0,0,0,.6); }

  /* AI Leaderboard */
  .board{ width:236px; }
  .board .rows{ padding:2px 12px 13px; display:flex; flex-direction:column; gap:6px; position:relative; }
  .board .row{ display:flex; align-items:center; gap:8px; background:#1b1b1b; border-radius:8px; padding:5px;
    transition:transform .55s var(--ease-spring); }
  .board .row .rk{ width:26px; height:26px; flex:none; background:#313131; border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:300; }
  .board .row .nm{ flex:1; font-size:14px; color:#fff; font-weight:300; letter-spacing:-0.3px; }
  .board .row .sc{ font-size:14px; color:#00be6f; font-weight:600; padding-right:7px; font-variant-numeric:tabular-nums; }

  /* folder-to-folder connection lines (electric blue, glowing) — drawn between folders only.
     z-index 15 sits ABOVE the brain so visible-folder links read crisp; the one line heading to a
     folder behind the brain is clipped to the periphery in JS (see drawFolderLinks). */
  #folderLinks{ position:absolute; inset:0; z-index:15; pointer-events:none;
    filter:drop-shadow(0 0 3px rgba(70,110,255,.9)); overflow:visible; }
  #folderLinks line{ stroke:#3a5bff; stroke-width:2; stroke-linecap:round; }
  #folderLinks rect{ fill:#6f93ff; }

  /* "IN MY BRAIN" — fixed bottom-right HUD with live hemisphere counts */
  #mind{ position:fixed; right:26px; bottom:26px; z-index:60; width:330px;
    border:1px solid #2f44ff; background:#000; border-radius:2px; overflow:hidden;
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,"Cascadia Code",monospace;
    box-shadow:0 0 30px rgba(47,68,255,.25); user-select:none; }
  #mind .mind-hd{ background:#2433ff; color:#fff; font-size:12px; font-weight:700;
    letter-spacing:1.2px; padding:6px 12px; }
  #mind .mind-body{ display:flex; }
  #mind .mind-col{ flex:1; padding:11px 14px 13px; }
  #mind .mind-col + .mind-col{ border-left:1px solid #2f44ff; }
  #mind .mind-ch{ font-size:10.5px; letter-spacing:.8px; color:#fff; padding-bottom:7px;
    margin-bottom:9px; border-bottom:1px solid #2f44ff; }
  #mind .mind-row{ display:flex; justify-content:space-between; gap:14px; font-size:10.5px;
    letter-spacing:.4px; line-height:1.9; }
  #mind .mind-row .k{ color:#8aa0ff; }
  #mind .mind-row .v{ color:#fff; font-variant-numeric:tabular-nums; }

  /* GPU Monitor */
  .gpu{ width:236px; }
  .gpu .body{ padding:0 14px 13px; }
  .gpu .row{ display:flex; align-items:flex-end; justify-content:space-between; }
  .gpu .row .lbl{ font-size:14px; color:#fff; font-weight:300; }
  .gpu .row .big{ font-size:32px; color:#00be6f; font-weight:600; line-height:.9; font-variant-numeric:tabular-nums; }
  .gpu canvas{ width:100%; height:62px; display:block; margin-top:8px; border-radius:6px; }

  /* Podcast */
  .pod{ width:288px; }
  .pod .body{ padding:11px 13px 13px; }
  .pod .np{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#fff; }
  .pod .np .gdot{ width:6px;height:6px;border-radius:50%; background:#00be6f; box-shadow:0 0 6px #00be6f; }
  .pod .grid{ display:flex; gap:12px; margin-top:11px; }
  .pod .cover{ width:104px; height:104px; flex:none; border-radius:9px; background:#305eff; position:relative;
    padding:9px; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; }
  .pod .cover .ct{ font-size:9.5px; line-height:1.08; color:#fff; font-weight:600; }
  .pod .cover .ca{ font-size:14px; color:#fff; font-weight:800; letter-spacing:-0.3px; }
  .pod .cover .arc{ position:absolute; right:-46px; bottom:-46px; width:128px; height:128px; border-radius:50%; border:1px solid rgba(255,255,255,.35); }
  .pod .cover .play{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.9); color:#000;
    display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; }
  .pod .right{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .pod .right .h{ font-size:16px; font-weight:800; line-height:1.0; letter-spacing:-0.4px; color:#fff; }
  .pod .right .a{ font-size:11px; color:#c8c8c8; margin-top:5px; }
  .pod .wave{ display:flex; align-items:center; gap:2px; height:26px; margin-top:auto; }
  .pod .wave i{ width:3px; background:#d9d9d9; border-radius:2px; height:18%; }
  .pod .snip{ font-size:10px; color:#c8c8c8; margin-top:6px; font-style:italic; transition:opacity .3s; }

  /* TOKENS — usage/spend meter (Figma): black card, dot-matrix title, dotted spend bar, DETAILS pill */
  .tokens{ width:300px; }
  .tokens .tcard{ background:#000; border:1px solid rgba(255,255,255,.12); border-radius:12px;
    box-shadow:0 16px 46px rgba(0,0,0,.7); padding:15px 17px 14px;
    transition:border-color .4s, box-shadow .4s; }
  .panel:hover .tokens .tcard{ border-color:rgba(255,255,255,.28);
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 0 34px rgba(255,255,255,.08), 0 22px 60px rgba(0,0,0,.65); }
  .tokens .ttitle{ font-family:'Bitcount Single',ui-monospace,"SF Mono",monospace; font-size:21px;
    color:#fff; line-height:1; letter-spacing:-0.4px; }
  .tokens .trow{ display:flex; justify-content:space-between; font-size:11px; color:#bfbfbf;
    letter-spacing:-0.3px; margin-top:13px; font-variant-numeric:tabular-nums; }
  .tokens .tbar{ display:flex; gap:2px; margin-top:11px; }
  .tokens .tcol{ flex:1; display:flex; flex-direction:column; gap:2px; }
  .tokens .tdot{ height:3px; border-radius:1px; background:#fff; }
  .tokens .tdot.off{ background:#737373; }
  .tokens .tcol.lead .tdot{ animation:tokpulse 1.4s ease-in-out infinite; }
  @keyframes tokpulse{0%,100%{opacity:1}50%{opacity:.45}}
  .tokens .tfoot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; }
  .tokens .twarn{ font-size:10.5px; color:#bfbfbf; line-height:1.25; max-width:152px; letter-spacing:-0.2px; }
  .tokens .tbtn{ background:#d4d4d4; color:#000; font-size:11px; font-weight:500; border-radius:9px;
    padding:6px 16px; white-space:nowrap; transition:background .3s, transform .3s var(--ease-spring); }
  .panel:hover .tokens .tbtn{ background:#fff; transform:translateY(-1px); }


  /* macOS "fan" files — children of the folder that rise UP out of it in an arc */
  .fanfile{ position:absolute; left:50%; top:30px;      /* start at the folder's paper slot, inside it */
    width:142px; min-height:80px;
    background:linear-gradient(180deg,#ffffff,#e7e8ee); border:1px solid rgba(0,0,0,.10);
    color:#17171b; font-size:11.5px; font-weight:600; line-height:1.3;
    padding:26px 13px 13px; border-radius:9px; display:flex; align-items:flex-end;
    box-shadow:0 16px 32px rgba(0,0,0,.5);
    transform-origin:center bottom; pointer-events:none;
    transform:translate(-50%,6px) scale(.3); opacity:0;
    transition:transform .6s var(--ease-spring), opacity .4s ease; }
  .fanfile.open{ opacity:1; }
  .fanfile .ic{ position:absolute; top:9px; left:13px; font-size:14px; color:#5b8cff; }
  .fanfile.page .ic{ color:#8a6bff; }

  /* ════════════════════════════════════════════════════════════════════
     "IDEAS AT 2 AM" — opened panels (Notes · Captcha · Doc).
     Ported from BrainOS/interactions.html. Each opened panel is a CHILD of the
     folder, so it orbits / scales / occludes WITH the brain. ".openpanel" is the
     positioning + rise-out-of-folder emergence wrapper; the panel chrome below
     (.note / .cap-win / .docfile) renders at its natural size and is shrunk by
     the wrapper's scale() to the Figma proportions.
     ════════════════════════════════════════════════════════════════════ */
  .openpanel{ position:absolute; left:50%; top:50%; z-index:1;
    transform-origin:center center; transform:translate(-50%,-50%) scale(.18); opacity:0;
    pointer-events:auto; will-change:transform,opacity;
    transition:transform .62s var(--ease-spring), opacity .42s ease; }

  /* shared macOS window chrome (light) */
  .mac{ border-radius:13px; overflow:hidden; background:#fff; border:1px solid rgba(0,0,0,.14);
    box-shadow:0 18px 40px rgba(0,0,0,.5); }
  .mac .bar{ position:relative; height:30px; display:flex; align-items:center; padding:0 12px; gap:8px;
    background:linear-gradient(#f3f3f4,#e3e3e5); border-bottom:1px solid #d2d2d6; }
  .mac .bar .lights{ display:flex; gap:7px; }
  .mac .bar .lights i{ width:11px;height:11px;border-radius:50%; }
  .mac .bar .lights .r{ background:#ff5f56;} .mac .bar .lights .y{ background:#febc2e;} .mac .bar .lights .g{ background:#28c840;}
  /* display:block / text-transform:none / letter-spacing:0 explicitly override the page's bare
     `.title` rule (uppercase + letter-spacing + display:flex), which would otherwise leak in and
     left-align this centred window title so it collides with the traffic-light buttons. */
  .mac .bar .title{ position:absolute; left:0; right:0; display:block; text-align:center;
    font-size:12px; color:#4f4f56; font-weight:500; letter-spacing:0; text-transform:none;
    white-space:nowrap; pointer-events:none; }

  /* Notes editor — HD chrome bg + live typewriter overlay */
  .note{ position:relative; width:var(--w); border-radius:12px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,.5); }
  .note img.chrome{ display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  .note .type{ position:absolute; top:var(--t); left:var(--l); right:var(--r); bottom:6%;
    white-space:pre-wrap; word-break:break-word; overflow:hidden;
    font-size:var(--fs); line-height:var(--lh,1.45); color:var(--col,#26262a); }
  .note .type .caret{ display:inline-block; width:2px; height:1.05em; vertical-align:-2px;
    background:currentColor; margin-left:1px; animation:blink 1s steps(1) infinite; }

  /* Captcha — Apple-Notes "Draft" window + interactive reCAPTCHA */
  .cap-win{ width:300px; }
  .cap-win .toolbar{ display:flex; align-items:center; gap:14px; padding:7px 14px; background:#faf6f5;
    border-bottom:1px solid #ece4e2; color:#b9b1af; font-size:13px; font-family:var(--mono); }
  .cap-win .toolbar .glyph{ opacity:.75; }
  .cap-win .body{ background:#fff; padding:22px 22px 26px; }
  .cap-win .q{ font-size:21px; line-height:1.12; letter-spacing:-.4px; color:#161616; font-weight:450; margin:0 0 22px; }
  .recaptcha{ display:flex; align-items:center; gap:12px; width:100%; max-width:256px;
    border:1px solid #d3d3d3; border-radius:4px; background:#f9f9f9; padding:11px 13px;
    box-shadow:0 1px 2px rgba(0,0,0,.08); user-select:none; }
  .recaptcha .checkbox{ width:26px; height:26px; flex:none; border:2px solid #c1c1c1; border-radius:3px;
    background:#fff; cursor:pointer; position:relative; transition:border-color .2s; }
  .recaptcha .checkbox:hover{ border-color:#a4a4a4; }
  .recaptcha .checkbox .spin{ position:absolute; inset:1px; border:3px solid #d9d9d9; border-top-color:#4a90d9;
    border-radius:50%; opacity:0; animation:rcspin .7s linear infinite; }
  .recaptcha .checkbox .tick{ position:absolute; inset:0; opacity:0; transform:scale(.4);
    transition:opacity .25s, transform .35s var(--ease-spring); }
  .recaptcha .checkbox .tick svg{ width:100%; height:100%; }
  .recaptcha.checking .checkbox{ border-color:transparent; }
  .recaptcha.checking .checkbox .spin{ opacity:1; }
  .recaptcha.done .checkbox{ border-color:transparent; }
  .recaptcha.done .checkbox .tick{ opacity:1; transform:scale(1); }
  @keyframes rcspin{to{transform:rotate(360deg);}}
  .recaptcha .lbl{ font-size:14px; color:#3c3c3c; font-family:var(--sans); }
  .recaptcha .brand{ margin-left:auto; text-align:center; color:#9b9b9b; }
  .recaptcha .brand .rc-logo{ width:30px; height:30px; display:block; margin:0 auto; }
  .recaptcha .brand .nm{ font-size:9px; letter-spacing:.2px; }
  .recaptcha .brand .tos{ font-size:7px; }

  /* Doc File — folded-corner document icon */
  .docfile{ width:180px; height:243px; position:relative; cursor:default;
    background:linear-gradient(150deg,#ffffff 60%,#e6e6e9);
    border-radius:11px; border-bottom-right-radius:11px;
    box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.05);
    clip-path:polygon(0 0, calc(100% - 38px) 0, 100% 38px, 100% 100%, 0 100%); }
  .docfile .fold{ position:absolute; top:0; right:0; width:38px; height:38px;
    background:linear-gradient(225deg,#cfcfd4,#fbfbfc); border-bottom-left-radius:7px;
    box-shadow:-2px 2px 5px rgba(0,0,0,.12); }
  .docfile .kind{ position:absolute; top:18px; left:14px; font-weight:700; font-size:27px;
    letter-spacing:-.5px; color:#9a9a9f; }
  .docfile .fname{ position:absolute; left:13px; right:13px; bottom:16px; font-size:15px; line-height:.95;
    letter-spacing:-.4px; color:#141414; word-break:break-word; }

  /* To-do List — white card, tickable rows, "+ Add" inserts a new idea */
  .todo{ width:330px; padding:18px 16px 18px; border-radius:11px;
    background:linear-gradient(#ffffff 74%,#e9e9ec); border:1px solid #c9c9cf;
    box-shadow:0 18px 40px rgba(0,0,0,.5); }
  .todo .top{ display:flex; align-items:center; margin-bottom:16px; }
  .todo .top .h{ font-size:22px; font-weight:550; letter-spacing:-.7px; color:#0c0c0c; }
  .todo .top .add{ margin-left:auto; background:#b4cdfd; color:#13213f; border:none; cursor:pointer;
    font-family:var(--sans); font-size:15px; font-weight:600; letter-spacing:-.3px;
    padding:7px 14px; border-radius:7px; transition:transform .2s, background .2s; }

  .auto .node{ position:absolute; display:flex; align-items:center; gap:11px;

     EASTER EGG — custom right-click menu → "Forbidden Vault" reveal

  #ctxMenu{ position:fixed; z-index:9999; display:none; top:0; left:0; min-width:201.7px;

  /* chrome fades away for a fully immersive reveal while the vault is shown */
  #brand,#hint,#mind,#folderLinks{ transition:opacity .5s var(--ease-soft); }
  body.vault-mode #brand,
  body.vault-mode #hint,
  body.vault-mode #mind,
  body.vault-mode #folderLinks{ opacity:0 !important; pointer-events:none; }

  /* the hidden "Forbidden Vault" glass folder — composited from the Figma 2052:139 vector
     exports (frosted white-gradient glass) over a soft blue glow. Everything is sized off the
     --vw knob (folder width), so it scales as one piece. 152px = same width as the other folders. */
  .panel.vault{ opacity:0; pointer-events:none; }
  .vault-folder{ --vw:152px; position:relative; width:var(--vw); height:calc(var(--vw) * 0.753);
    user-select:none; filter:drop-shadow(0 18px 40px rgba(0,0,0,.55)); }
  .vault-folder .vf-glow{ position:absolute; left:9%; top:30%; width:76%; height:58%;

  .vault-folder .vf-tab{ position:absolute; left:0; top:0; width:46.25%; height:12.1%; display:block; }

  .vault-folder .vf-title{ position:absolute; left:10.2%; top:44.9%; width:86%; z-index:2;

    font-size:calc(var(--vw) * 0.166); letter-spacing:calc(var(--vw) * -0.0033); }

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  /* ════════════════════════════════════════════════════════════════════
     BRAIN CORE — ported directly from dither_brain.html (unchanged behaviour)
     ════════════════════════════════════════════════════════════════════ */
  const AUTO_ROTATE_SPEED  = 0.8;    // ← idle spin speed. Higher = faster. Set 0 to stop.
  const VERTICAL_LIMIT_DEG = 25;
  const DRAG_SENSITIVITY   = 1.0;

  // ── BRAIN SPIN EASING + FOLDER RULES ───────────────────────────────
  // Opening a folder eases the auto-rotation to a firm, slow stop (so its panels
  // hold still while you read them) AND locks user rotation (drag) — you can't spin
  // the brain while a folder is open. Closing eases the spin back up and re-enables drag.
  const SPIN_TAU = 0.7;                                   // ease time-constant (s) — higher = slower, more deliberate stop
  let spinCur = AUTO_ROTATE_SPEED, spinTarget = AUTO_ROTATE_SPEED;
  const _spinHolds = new Set();
  function brainHold(by){ _spinHolds.add(by); spinTarget = 0; controls.enableRotate = false; }   // ease to a stop + lock rotation
  function brainRelease(by){ _spinHolds.delete(by); if (!_spinHolds.size){ spinTarget = AUTO_ROTATE_SPEED; controls.enableRotate = true; } }  // resume spin + unlock

  // ── EASTER EGG: "FORBIDDEN VAULT" REVEAL ───────────────────────────
  // Right-click → custom menu → fade out every panel + the HUD chrome, then spin the
  // brain a half-turn to the BACK to reveal a hidden glass folder. Click away → reverse it.
  let vaultState  = 'idle';     // 'idle' | 'entering' | 'shown' | 'exiting'
  let vaultHidden = false;      // drives the per-frame fade of the 8 normal panels (see updatePanels)
  let vaultReveal = false;      // drives the per-frame fade of the vault panel itself
  let vaultEntry  = null;       // the anchored Forbidden Vault panel
  // ╔════════════════════════════════════════════════════════════════════╗
  // ║  KNOB: at WHICH rotation the brain rests when the vault is revealed.  ║
  // ║  Absolute camera azimuth (degrees). The reveal always lands here, and ║
  // ║  the folder is pinned to this same spot so they stay aligned.         ║
  // ║    0 = front · 90 = right side (default) · 180 = back · 270 = left.    ║
  // ╚════════════════════════════════════════════════════════════════════╝
  const VAULT_VIEW_AZIMUTH_DEG = 120;
  let vaultReturnAz = 0;        // azimuth to spin back to on dismiss
  let vaultReturnPolar = Math.PI / 2;   // polar (vertical) angle to restore on dismiss
  const normalizeAngle = (a) => { a %= Math.PI * 2; if (a > Math.PI) a -= Math.PI * 2; if (a <= -Math.PI) a += Math.PI * 2; return a; };
  // Scripted camera turn: we drive the camera azimuth AND polar ourselves (autoRotate + damping OFF)
  // so the move is exact. Both angles are eased, so it glides smoothly from WHATEVER angle you're at
  // (high/low/spun) to the resting view — no snap. controls.update() reads camera.position and stays in sync.
  const camAnim = { active:false, from:0, to:0, fromPolar:Math.PI/2, toPolar:Math.PI/2, t:0, dur:1.2, radius:3, onDone:null };
  function startCamTurn(toAngle, dur, onDone, toPolar){
    camAnim.from = controls.getAzimuthalAngle();
    camAnim.fromPolar = controls.getPolarAngle();
    camAnim.toPolar = (toPolar != null) ? toPolar : Math.PI / 2;   // default: settle level
    camAnim.to = toAngle; camAnim.t = 0; camAnim.dur = dur; camAnim.onDone = onDone || null;
    camAnim.radius = camera.position.distanceTo(controls.target);
    camAnim.active = true;
    controls.autoRotate = false; controls.enableDamping = false;
  }

  // ── ONLY ONE FOLDER OPEN AT A TIME ─────────────────────────────────
  // Each folder registers its close() here; opening a folder first closes whichever
  // other folder is currently open.
  const _folderClosers = new Map();   // folderEl → close()
  let _openFolderEl = null;

  // ╔═══════════════════════════════════════════════════════════════════╗
  // ║  BRAIN_ZOOM  —  this is the knob to make the brain BIGGER/SMALLER.  ║
  // ║  Camera distance = baseDistance × BRAIN_ZOOM.                       ║
  // ║  LOWER  = zoom IN  = bigger brain  (don't go below ~0.80 or the     ║
  // ║           brain starts to clip top/bottom).                         ║
  // ║  HIGHER = zoom OUT = smaller brain.                                 ║
  // ╚═══════════════════════════════════════════════════════════════════╝
  const BRAIN_ZOOM = 1.0;   // 1.0 = bounding sphere fits the framebuffer at EVERY rotation (no clipping)

  const DEBUG_REGIONS = false;
  const REGION = { splitAxis: 'x', splitSign: 1, splitAt: 0.5 };
  const HIGHLIGHT = { tintBlend: 0.0 };
  const REGION_DEBUG_COLORS = ['#ff5555', '#5599ff'];
  const REGION_LEFT = 0, REGION_RIGHT = 1;

  const displayCanvas = document.getElementById('displayCanvas');
  const ctx = displayCanvas.getContext('2d', { alpha: true });
  const statusEl = document.getElementById('status');
  function setStatus(msg, kind = '') { statusEl.innerHTML = msg; statusEl.className = kind; }

  const isFileProtocol = location.protocol === 'file:';
  if (isFileProtocol) {
    setStatus('Open this page via a local server, not <code>file://</code>.<br>' +
      'Run <code>python3 -m http.server 8000</code>, then open <code>http://localhost:8000/BrainOS/</code>.', 'error');
  } else { setStatus('Loading 3D model…'); }

  const offscreenCanvas = document.createElement('canvas');
  const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

  const charSets = {
    ascii:   "Ñ@#W$9876543210?!abc;:+=-,._ ",
    blocks:  "█▓▒░ ", binary: "10 ", minimal: "#*+-. "
  };

  const inputs = {
    resolution: el('resolution'), noise: el('noise'), fps: el('fps'), threshold: el('threshold'),
    contrast: el('contrast'), shadowLift: el('shadowLift'), tones: el('tones'), highlight: el('highlight'),
    charset: el('charset'), tintColor: el('tintColor'), rotY: el('rotY'), rotX: el('rotX'), rotZ: el('rotZ'),
    tiltX: el('tiltX'), tiltY: el('tiltY'), tiltZ: el('tiltZ'), zoom: el('zoom'),
    modelColor: el('modelColor'), lightIntensity: el('lightIntensity'),
  };
  function el(id){ return document.getElementById(id); }

  const threeCanvas = document.createElement('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 3);

  RectAreaLightUniformsLib.init();
  const areaLight = new THREE.RectAreaLight(0xffffff, 6, 6, 6);
  areaLight.position.set(6, 1, -4); areaLight.lookAt(0, 0, 0); scene.add(areaLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.45);
  fillLight.position.set(-5, 1.5, 2); scene.add(fillLight); scene.add(fillLight.target);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x0a0a10, 0.2));

  const keyLightOffset = new THREE.Vector3(), fillLightOffset = new THREE.Vector3();
  function updateLightRig() {
    camera.updateMatrixWorld();
    areaLight.position.copy(keyLightOffset).applyMatrix4(camera.matrixWorld); areaLight.lookAt(0, 0, 0);
    fillLight.position.copy(fillLightOffset).applyMatrix4(camera.matrixWorld);
  }

  const brainGroup = new THREE.Group(); scene.add(brainGroup);

  const controls = new OrbitControls(camera, displayCanvas);
  controls.target.set(0, 0, 0);
  controls.enablePan = false; controls.enableZoom = false;
  controls.enableDamping = true; controls.dampingFactor = 0.045;
  controls.rotateSpeed = DRAG_SENSITIVITY * 0.7;
  // Auto-rotate ON — the brain idly spins and every attached panel orbits with it.
  controls.autoRotate = true; controls.autoRotateSpeed = AUTO_ROTATE_SPEED;
  const polarHalfRange = THREE.MathUtils.degToRad(VERTICAL_LIMIT_DEG);
  controls.minPolarAngle = Math.PI / 2 - polarHalfRange;
  controls.maxPolarAngle = Math.PI / 2 + polarHalfRange;

  let brainModel = null, baseDistance = 3, isBrainLoaded = false;
  let currentModelColor = inputs.modelColor.value;
  let brainMesh = null, brainGeometry = null, brainMaterial = null;
  let modelRadius = 1;                     // max dimension — used to scale panel anchors

  function classifyRegions(geometry) {
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox, min = bb.min, size = new THREE.Vector3().subVectors(bb.max, bb.min);
    const pos = geometry.getAttribute('position'), n = pos.count;
    const region = new Float32Array(n);
    const colors = DEBUG_REGIONS ? new Float32Array(n * 3) : null;
    const dbg = DEBUG_REGIONS ? REGION_DEBUG_COLORS.map(h => new THREE.Color(h)) : null;
    const axis = REGION.splitAxis;
    const get = axis === 'x' ? 'getX' : axis === 'y' ? 'getY' : 'getZ';
    const s = axis === 'x' ? size.x : axis === 'y' ? size.y : size.z;
    const m = axis === 'x' ? min.x : axis === 'y' ? min.y : min.z;
    for (let i = 0; i < n; i++) {
      let t = s ? (pos[get](i) - m) / s : 0.5;
      if (REGION.splitSign < 0) t = 1 - t;
      const id = t < REGION.splitAt ? REGION_LEFT : REGION_RIGHT;
      region[i] = id;
      if (colors) { const c = dbg[id]; colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b; }
    }
    geometry.setAttribute('region', new THREE.BufferAttribute(region, 1));
    if (colors) geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  }

  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
  dracoLoader.setDecoderConfig({ type: 'js' });
  const gltfLoader = new GLTFLoader(); gltfLoader.setDRACOLoader(dracoLoader);

  gltfLoader.load('Brain.glb', (gltf) => {
    brainModel = gltf.scene;
    brainModel.traverse(node => {
      if (node.isMesh) {
        const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(currentModelColor), roughness: 0.78, metalness: 0.0 });
        if (DEBUG_REGIONS) mat.vertexColors = true;
        node.material = mat; brainMesh = node; brainGeometry = node.geometry; brainMaterial = mat;
      }
    });
    const box = new THREE.Box3().setFromObject(brainModel);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    brainModel.position.sub(center);
    if (brainGeometry) classifyRegions(brainGeometry);
    const maxDim = Math.max(size.x, size.y, size.z); modelRadius = maxDim;
    const fovRad = (camera.fov * Math.PI) / 180;
    baseDistance = (maxDim / (2 * Math.tan(fovRad / 2)));
    brainGroup.add(brainModel);
    camera.position.set(0, 0, baseDistance * BRAIN_ZOOM);
    controls.update();
    camera.updateMatrixWorld();
    keyLightOffset.copy(areaLight.position).applyMatrix4(camera.matrixWorld.clone().invert());
    fillLightOffset.copy(fillLight.position).applyMatrix4(camera.matrixWorld.clone().invert());
    isBrainLoaded = true; setStatus('', 'ok');
    setupPanels();                          // build the anchored manifestations now that we know modelRadius
    setupFolderLinks();                     // wire up the folder-to-folder connection lines
    animateMindPanel();                     // start the "IN MY BRAIN" live counters
  },
  (xhr) => { if (isFileProtocol) return; if (xhr.lengthComputable) setStatus(`Loading 3D model… ${Math.round((xhr.loaded/xhr.total)*100)}%`); },
  (err) => { console.error('Failed to load Brain.glb:', err); if (isFileProtocol) return;
    setStatus('Failed to load <code>Brain.glb</code>. Check the console for details.', 'error'); });

  const W = 1440, H = 750;
  displayCanvas.width = W; displayCanvas.height = H;
  offscreenCanvas.width = W; offscreenCanvas.height = H;
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : { r: 255, g: 255, b: 255 };
  }

  let lastDrawTime = performance.now(), lastFrameTime = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - lastFrameTime) / 1000); lastFrameTime = now;

    if (isBrainLoaded) {
      brainModel.rotation.set(parseFloat(inputs.tiltX.value), parseFloat(inputs.tiltY.value), parseFloat(inputs.tiltZ.value));
      if (camAnim.active) {
        // EASTER EGG: ease BOTH the azimuth and the polar (vertical) angle from wherever the camera
        // currently is to the resting view — so it glides smoothly from any high/low angle, never snaps.
        // controls.update() below reads this position and keeps it.
        camAnim.t = Math.min(1, camAnim.t + dt / camAnim.dur);
        const u = camAnim.t, e = u * u * u * (u * (u * 6 - 15) + 10);   // smootherstep — gentle accel + settle
        const th = camAnim.from + (camAnim.to - camAnim.from) * e;
        const ph = camAnim.fromPolar + (camAnim.toPolar - camAnim.fromPolar) * e;
        const r = camAnim.radius, tg = controls.target, sp = Math.sin(ph);
        camera.position.set(tg.x + r * sp * Math.sin(th), tg.y + r * Math.cos(ph), tg.z + r * sp * Math.cos(th));
        camera.lookAt(tg);
        if (camAnim.t >= 1) { camAnim.active = false; const cb = camAnim.onDone; camAnim.onDone = null; if (cb) cb(); }
      } else {
        // ease the auto-rotation toward its target (0 while a folder is open) for a smooth, firm stop
        spinCur += (spinTarget - spinCur) * (1 - Math.exp(-dt / SPIN_TAU));
        if (spinTarget === 0 && spinCur < 0.02) spinCur = 0;   // settle firmly to a full halt
        controls.autoRotateSpeed = spinCur;
      }
      controls.update(dt);
      updateLightRig();
      updatePanels(dt);                     // ← project the attached manifestations every frame
      renderer.render(scene, camera);
    }

    const fps = parseInt(inputs.fps.value);
    if (now - lastDrawTime < 1000 / fps) return;
    lastDrawTime = now;

    offCtx.clearRect(0, 0, W, H);
    if (isBrainLoaded) offCtx.drawImage(threeCanvas, 0, 0, W, H);

    drawDither();
  }

  function drawDither() {
    const res = parseInt(inputs.resolution.value);
    const noiseLvl = parseInt(inputs.noise.value);
    const thresh = parseFloat(inputs.threshold.value);
    const contrast = parseFloat(inputs.contrast.value);
    const shadowLift = parseInt(inputs.shadowLift.value);
    const tones = parseInt(inputs.tones.value);
    const highlight = parseFloat(inputs.highlight.value);
    const tint = hexToRgb(inputs.tintColor.value);
    const mode = inputs.charset.value === 'halftone' ? 'halftone' : 'ascii';
    const density = charSets[inputs.charset.value] || charSets.minimal;

    // Transparent canvas: paint ONLY the brain silhouette (opaque). Everything outside
    // stays clear, so a panel sitting behind the brain (lower z-index) is occluded only
    // by the brain SHAPE — it tucks partly behind the brain instead of vanishing.
    ctx.clearRect(0, 0, W, H);
    ctx.font = `bold ${res}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (!isBrainLoaded) return;

    const pixels = offCtx.getImageData(0, 0, W, H).data;
    for (let y = 0; y < H; y += res) {
      for (let x = 0; x < W; x += res) {
        const index = (y * W + x) * 4;
        const r = pixels[index], g = pixels[index+1], b = pixels[index+2], a = pixels[index+3];
        if (a < 128) continue;
        // fill this brain cell solid + opaque → builds a solid silhouette occluder;
        // the dithered glyph is drawn on top of it below.
        ctx.fillStyle = "#000"; ctx.fillRect(x, y, res, res);
        const srcLum = r * 0.299 + g * 0.587 + b * 0.114;
        let brightness = srcLum;
        brightness = ((brightness / 255 - 0.5) * contrast + 0.5) * 255;
        brightness = brightness + shadowLift * (1 - Math.max(0, Math.min(255, brightness)) / 255);
        const noise = (Math.random() - 0.5) * noiseLvl;
        brightness = (brightness * thresh) + noise;
        brightness = Math.max(0, Math.min(255, brightness));
        if (brightness < 10) continue;
        const lvl = Math.min(tones - 1, Math.floor((brightness / 255) * tones));
        const intensity = (lvl === tones - 1) ? highlight : (lvl + 1) / tones;
        let cr, cg, cb;
        const chroma = Math.max(r, g, b) - Math.min(r, g, b);
        if (chroma < 18) { cr = tint.r * intensity; cg = tint.g * intensity; cb = tint.b * intensity; }
        else {
          const norm = srcLum > 0 ? intensity / (srcLum / 255) : intensity;
          cr = r * norm; cg = g * norm; cb = b * norm;
          const tb = HIGHLIGHT.tintBlend;
          if (tb > 0) { cr = cr*(1-tb)+tint.r*intensity*tb; cg = cg*(1-tb)+tint.g*intensity*tb; cb = cb*(1-tb)+tint.b*intensity*tb; }
        }
        const col = `rgb(${Math.min(255,cr)|0}, ${Math.min(255,cg)|0}, ${Math.min(255,cb)|0})`;
        const cx = x + res/2, cy = y + res/2;
        if (mode === 'halftone') {
          ctx.lineWidth = Math.max(0.5, intensity * res * 0.2); ctx.strokeStyle = col;
          ctx.beginPath(); ctx.arc(cx, cy, res * 0.42, 0, Math.PI * 2); ctx.stroke();
        } else {
          const charIndex = Math.floor((1 - intensity) * (density.length - 1));
          ctx.fillStyle = col; ctx.fillText(density[charIndex], cx, cy);
        }
      }
    }
  }
  requestAnimationFrame(loop);

  /* ════════════════════════════════════════════════════════════════════
     ANCHORED MANIFESTATIONS — HTML children of the brain
     Each entry has a fixed 3D anchor (in brain-centred world space). The brain
     is world-fixed and the CAMERA orbits it (OrbitControls), so re-projecting
     these anchors every frame makes the panels move/scale/depth-sort/fade WITH
     the brain exactly as if they were welded to its surface. No wires.
     ════════════════════════════════════════════════════════════════════ */
  const panelsLayer = document.getElementById('panels');
  const PANELS = [];                  // {el, anchor:Vector3, scale, opacity, hover}
  const _v = new THREE.Vector3();
  const PANEL_SCALE = 0.54;           // small → the brain stays the hero, panels fit on its flanks
  const IDLE_OPACITY = 1.0;           // fully opaque — the brain never shows through a panel

  function addAnchored(elm, anchorVec, scale = 1, opts = {}) {
    const entry = { el: elm, anchor: anchorVec, scale, opacity: 0, hover: false, ...opts };
    elm.addEventListener('pointerenter', () => entry.hover = true);
    elm.addEventListener('pointerleave', () => entry.hover = false);
    PANELS.push(entry); return entry;
  }
  function removeAnchored(entry) {
    const i = PANELS.indexOf(entry); if (i >= 0) PANELS.splice(i, 1);
    if (entry.el && entry.el.parentNode) entry.el.parentNode.removeChild(entry.el);
  }

  // anchor authored in units of modelRadius (R). +x screen-right, +y up, +z toward camera.
  function A(x, y, z){ return new THREE.Vector3(x, y, z).multiplyScalar(modelRadius); }

  // Pin to the ACTUAL brain mesh: shoot a ray from outside (along `dir`) toward the
  // centre and take the first surface hit, so the panel sits on the real geometry
  // (folds/bumps) in that direction — not on a smooth sphere. Falls back to a sphere
  // point if the ray misses. The hit is in world space and the brain is world-fixed,
  // so the panel stays welded to that exact point as the camera orbits.
  const _surfRay = new THREE.Raycaster();
  function surfaceAnchor(dir, lift = 0.05){
    const d = dir.clone().normalize();
    _surfRay.set(d.clone().multiplyScalar(modelRadius * 2.2), d.clone().negate());
    const hits = brainMesh ? _surfRay.intersectObject(brainMesh, false) : [];
    // The ray runs through the origin, so the hit lies on the `d` axis → its distance from
    // centre is the surface radius in this direction. Clamp to a minimum so a panel never
    // sinks into a recess/valley; it always rests on the brain's OUTER envelope like the rest.
    let radius = hits.length ? hits[0].point.length() : modelRadius * 0.45;
    radius = Math.max(radius, modelRadius * 0.42);
    return d.multiplyScalar(radius + modelRadius * lift);
  }

  function updatePanels(dt) {
    if (!isBrainLoaded || !PANELS.length) return;
    const rect = displayCanvas.getBoundingClientRect();
    const camN = camera.position.clone().normalize();
    const camDist = camera.position.length();   // brain CENTRE → camera; the front/back divide plane
    for (const p of PANELS) {
      _v.copy(p.anchor);
      const dist = _v.distanceTo(camera.position);
      _v.project(camera);
      const sx = rect.left + (_v.x * 0.5 + 0.5) * rect.width;
      const sy = rect.top  + (-_v.y * 0.5 + 0.5) * rect.height;
      // facing: 1 = anchor toward camera (front of the brain), -1 = away (behind it)
      const facing = p.anchor.clone().normalize().dot(camN);
      p._sx = sx; p._sy = sy; p._facing = facing;   // cached for the folder-link layer
      const depthScale = THREE.MathUtils.clamp(baseDistance / dist, 0.85, 1.12);
      p.el.style.left = sx + 'px';
      p.el.style.top  = sy + 'px';
      p.el.style.transform = `translate(-50%,-50%) scale(${(depthScale * p.scale * PANEL_SCALE).toFixed(3)})`;
      // OCCLUSION + DEPTH-SORT: z-index is a CONTINUOUS function of the panel's real
      // distance to the camera, with the brain canvas (z 10) as the divider plane.
      // A panel nearer than the brain centre lands above 10 (in front of the brain);
      // one further away lands below 10 (behind it, occluded). Because every panel gets
      // its own depth-scaled value, two panels on the SAME side now stack correctly by
      // depth instead of by DOM order — so e.g. TOKENS no longer paints over a closer card.
      const rel = (camDist - dist) / modelRadius;        // +near … −far  (≈ ±1 across the brain)
      p.el.style.zIndex = Math.round(10 + rel * 100);     // brain=10; front 10→~110, back 10→~-90
      const offEdge = Math.max(Math.abs(_v.x), Math.abs(_v.y));
      const onScreen = offEdge < 1.7 ? 1 : 0;          // frustum safety only — no orbit fade
      if (p.isVault) {
        // EASTER EGG: the vault's visibility tracks the reveal state, not the frustum.
        p.opacity += ((vaultReveal ? 1 : 0) - p.opacity) * 0.1;
        p.el.style.opacity = p.opacity.toFixed(3);
        p.el.style.pointerEvents = (vaultState === 'shown' && vaultReveal) ? 'auto' : 'none';
      } else {
        if (!p.skipOpacity) {
          const target = vaultHidden ? 0 : onScreen;          // EASTER EGG: fade all panels out in vault mode
          p.opacity += (target - p.opacity) * (vaultHidden ? 0.12 : 0.3);
          p.el.style.opacity = p.opacity.toFixed(3);
        }
        p.el.style.pointerEvents = (!vaultHidden && facing > 0.05 && onScreen) ? 'auto' : 'none';
      }
    }
    drawFolderLinks(dt);
  }

  // ── FOLDER CONNECTIONS ──────────────────────────────────────────────
  // Thin glowing electric-blue lines drawn between the FOLDERS only (never the
  // data panels), with a small square node at each end — like the reference.
  //
  // RING TOPOLOGY: each folder links only to its NEIGHBOURS around the brain
  // (folders sorted by azimuth, closed into a loop) — never across to a far
  // folder on the back side.
  //
  // GROW / RETRACT: a line's drawn length tracks how visible its FAR folder is.
  // The line grows out of the visible (anchor) folder toward a neighbour as the
  // neighbour comes into view, and smoothly retracts + fades as it swings behind
  // — so it never reaches, points at, or runs behind a hidden folder.
  const linkSvg  = document.getElementById('folderLinks');
  const SVGNS    = 'http://www.w3.org/2000/svg';
  const LINK_TAU = 0.05;   // grow/retract easing time constant (s) — lower = faster trim animation
  let folderEntries = [], linkEdges = [], linkDefs = null;
  function setupFolderLinks() {
    folderEntries = PANELS.filter(p => p.el.classList.contains('folder'));
    linkEdges = [];
    linkSvg.innerHTML = '';
    linkDefs = document.createElementNS(SVGNS, 'defs');
    linkSvg.appendChild(linkDefs);
    // order folders by azimuth around the vertical axis → a stable ring
    const order = folderEntries
      .map((p, i) => ({ p, i, phi: Math.atan2(p.anchor.x, p.anchor.z) }))
      .sort((a, b) => a.phi - b.phi)
      .map(o => o.p);
    const N = order.length;
    for (let i = 0; i < N; i++) {
      const a = order[i], b = order[(i + 1) % N];      // consecutive neighbours, closed loop
      const grad = document.createElementNS(SVGNS, 'linearGradient');
      grad.id = 'flgrad_' + i;
      grad.setAttribute('gradientUnits', 'userSpaceOnUse');
      const s0 = document.createElementNS(SVGNS, 'stop'); s0.setAttribute('offset', '0');
      const s1 = document.createElementNS(SVGNS, 'stop'); s1.setAttribute('offset', '1');
      grad.append(s0, s1); linkDefs.appendChild(grad);
      const ln = document.createElementNS(SVGNS, 'line');
      ln.setAttribute('stroke', 'url(#flgrad_' + i + ')');
      const r1 = document.createElementNS(SVGNS, 'rect');
      const r2 = document.createElementNS(SVGNS, 'rect');
      [r1, r2].forEach(r => { r.setAttribute('width', 7); r.setAttribute('height', 7); });
      linkSvg.append(ln, r1, r2);
      linkEdges.push({ a, b, ln, r1, r2, grad, s0, s1, p: 0 });
    }
  }
  function frontness(f) { return THREE.MathUtils.clamp((f + 0.2) / 0.5, 0, 1); }
  function smoothstep(e0, e1, x) { const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
  function drawFolderLinks(dt) {
    if (!linkEdges.length) return;
    const k = 1 - Math.exp(-(dt || 0.016) / LINK_TAU);   // frame-rate-independent ease factor
    for (const e of linkEdges) {
      const fa = frontness(e.a._facing), fb = frontness(e.b._facing);
      // anchor = the more front-facing folder; far = the one that may be swinging behind
      const aFront = fa >= fb;
      const anchorE = aFront ? e.a : e.b, farE = aFront ? e.b : e.a;
      const anchorF = aFront ? fa : fb, farF = aFront ? fb : fa;

      if (Math.max(fa, fb) < 0.04 || e.a._sx == null || e.b._sx == null) {
        e.p = 0;
        e.ln.style.display = e.r1.style.display = e.r2.style.display = 'none';
        continue;
      }
      // GROW / RETRACT: the drawn length tracks how visible the FAR folder is. As the far folder
      // comes into view the line grows toward it; as it swings behind, the line retracts toward the
      // visible (anchor) folder and fades — so it never reaches, points at, or runs behind a hidden
      // folder. Symmetric on both sides; no brain-disc geometry needed.
      e.p += (farF - e.p) * k;

      const ra = anchorE.el.querySelector('img').getBoundingClientRect();
      const rb = farE.el.querySelector('img').getBoundingClientRect();
      // ONE fixed connection point per folder (top-centre of the card) shared by all of its lines,
      // so each folder shows a single node — not a separate corner per edge.
      const A  = { x: ra.left + ra.width * 0.5, y: ra.top + 6 };
      const B  = { x: rb.left + rb.width * 0.5, y: rb.top + 6 };
      const hx = A.x + (B.x - A.x) * e.p, hy = A.y + (B.y - A.y) * e.p;   // drawn head (grows/retracts)

      e.ln.setAttribute('x1', A.x); e.ln.setAttribute('y1', A.y);
      e.ln.setAttribute('x2', hx);  e.ln.setAttribute('y2', hy);
      // gradient: bright at the anchor, the retracting far end softly fades out as the folder hides
      e.grad.setAttribute('x1', A.x); e.grad.setAttribute('y1', A.y);
      e.grad.setAttribute('x2', hx);  e.grad.setAttribute('y2', hy);
      e.s0.setAttribute('stop-color', '#3a5bff'); e.s1.setAttribute('stop-color', '#3a5bff');
      e.s0.setAttribute('stop-opacity', anchorF.toFixed(3));
      e.s1.setAttribute('stop-opacity', (farF * farF).toFixed(3));

      // anchor node at the visible folder; head node only once the line has reached the far folder
      e.r1.setAttribute('x', A.x - 3.5); e.r1.setAttribute('y', A.y - 3.5);
      e.r2.setAttribute('x', hx - 3.5);  e.r2.setAttribute('y', hy - 3.5);
      e.ln.style.display = e.r1.style.display = e.r2.style.display = '';
      e.r1.style.opacity = anchorF.toFixed(2);
      e.r2.style.opacity = (farF * smoothstep(0.9, 1, e.p)).toFixed(2);
    }
  }

  // macOS "fan" view: clicking the folder makes its files rise UP out of it in a curved
  // fan. The files are CHILDREN of the folder element, so they emerge from inside it and
  // travel/scale/occlude together with the folder as the brain rotates.
  function makeFan(folderEl, files, isPage) {
    let open = false; const items = [];
    folderEl.addEventListener('click', () => { open = !open; open ? openFan() : closeFan(); });
    function openFan() {
      brainHold(folderEl);                          // ease the brain to a firm, slow stop
      files.forEach((txt, k) => {
        const f = document.createElement('div');
        f.className = 'fanfile' + (isPage ? ' page' : '');
        f.innerHTML = `<span class="ic">${isPage ? '✎' : '▤'}</span>${txt}`;
        folderEl.appendChild(f); items.push(f);
        const ty = -(44 + k * 56);                 // each file higher than the last
        const tx = Math.sin(k * 0.7) * 22;          // gentle horizontal arc → fan shape
        const rot = Math.sin(k * 0.7) * 7;          // slight tilt per file
        requestAnimationFrame(() => requestAnimationFrame(() => {
          f.style.transitionDelay = (k * 45) + 'ms';   // pop out one after another
          f.style.transform = `translate(-50%, ${ty}px) translateX(${tx}px) rotate(${rot}deg) scale(1)`;
          f.classList.add('open');
        }));
      });
    }
    function closeFan() {
      brainRelease(folderEl);                       // let the brain ease back into its idle spin
      items.forEach((f, k) => {
        f.style.transitionDelay = ((items.length - k) * 30) + 'ms';   // suck back in, top first
        f.classList.remove('open');
        f.style.transform = 'translate(-50%, 6px) scale(.3)';
        setTimeout(() => f.remove(), 700 + items.length * 30);
      });
      items.length = 0;
    }
  }

  // Football Tracker: the ball is always in motion (bounces off the walls); press the field to kick
  // (a big boost that decays back to cruise). The detection box + velocity HUD + dashed trail stay
  // locked to it. Measures via offsetWidth/Height (LAYOUT px) so the physics stay correct even though
  // the panel is CSS-scaled on the brain (getBoundingClientRect would return shrunken, scaled px).
  function initFootball(field) {
    if (!field) return;
    const ball = field.querySelector('.ft-ball');
    const box  = field.querySelector('.ft-box');
    const vel  = field.querySelector('.ft-vel .v');
    const poly = field.querySelector('.ft-trail polyline');
    const R = 23, VRX = 20, VRY = 23, PAD = 14;      // element half-size (centering) · visible-glyph radii x/y (the ⚽ glyph is ~40w×47t) · detection-box padding
    const BASE = 2.7, BOOST = 18, DECAY = 0.99;      // cruise speed · press kick · per-frame boost decay (→1 = speed lingers longer)
    const VSCALE = 3.6;                              // px/frame → displayed m/s (telemetry feel)
    let W = 0, H = 0;
    const measure = () => { W = field.offsetWidth; H = field.offsetHeight; };
    measure();
    let x = 120, y = 130, vx = BASE * 0.9, vy = -BASE * 0.6;
    const trail = [];
    function bounce() {                              // clamp to the visible glyph (VRX/VRY), not the padded box — so it kisses the wall
      if (x < VRX) { x = VRX; vx = Math.abs(vx); }  if (x > W - VRX) { x = W - VRX; vx = -Math.abs(vx); }
      if (y < VRY) { y = VRY; vy = Math.abs(vy); }  if (y > H - VRY) { y = H - VRY; vy = -Math.abs(vy); }
    }
    field.addEventListener('pointerdown', () => {                   // press anywhere → big kick
      let s = Math.hypot(vx, vy); if (s < 0.01) { vx = BASE; vy = 0; s = BASE; }
      const f = BOOST / s; vx *= f; vy *= f;
      field.classList.add('kick'); setTimeout(() => field.classList.remove('kick'), 150);
    });
    (function frame() {
      if (!field.isConnected) return;                               // panel closed → stop the loop
      requestAnimationFrame(frame);
      if (!W) measure();
      x += vx; y += vy; bounce();
      let s = Math.hypot(vx, vy);                                    // bleed kicks back toward BASE, never below
      if (s > BASE + 0.001) { const t = Math.max(BASE, s * DECAY), f = t / s; vx *= f; vy *= f; }
      else if (s > 0.001 && s < BASE) { const f = BASE / s; vx *= f; vy *= f; }
      else if (s <= 0.001) { vx = BASE; vy = 0; }
      ball.style.transform = `translate(${(x - R).toFixed(1)}px, ${(y - R).toFixed(1)}px)`;
      const bs = R + PAD;
      box.style.left = (x - bs) + 'px'; box.style.top = (y - bs) + 'px';
      box.style.width = box.style.height = (bs * 2) + 'px';
      vel.textContent = (s * VSCALE).toFixed(1);                     // velocity HUD — spikes on a kick, settles to cruise
      trail.push(x.toFixed(0) + ',' + y.toFixed(0)); if (trail.length > 18) trail.shift();
      poly.setAttribute('points', trail.join(' '));
    })();
  }

  // AI Kitchen Co-Pilot: type the AI line → reveal option chips → pick one → type the reply → after a

  function initKitchen(kit) {

      { label:"🔥 Emotional Damage Curry", reply:"Add the second onion when it hurts the most. Serve immediately." }
    ];
    let resetT;
    function typeLine(text, done) {
      aiLine.textContent = '';
      const t = document.createTextNode(''), c = document.createElement('span'); c.className = 'caret';
      aiLine.append(t, c);
      let i = 0;
      (function step() {
        if (!kit.isConnected) return;

      chipsEl.innerHTML = '';

      setTimeout(() => typeLine(o.reply), 260);

                  </svg>
                </div>
              </div>`,
        init: w => initAutomation(w.querySelector('.auto')) },
      { tx:175, ty:-165, k:0.73, delay:90,                       // Notes Editor 4 — grown to match the Flow's height (balanced pair)
        html:`<div class="note a4note">
                <img class="chrome" src="../panels/notesEditor4.webp" width="1879" height="1521" alt="Notes editor" draggable="false">

  // Automation Flow: reveal nodes & draw wires left→right (Form Submission → AI Agent + tools →
  // Is Manager? → outputs), then stream packets along the connected edges. Loops. Coordinate space =
  // the design's 436.6×270.5 (the edges-svg viewBox), so node ports meet the wire paths exactly.
  function initAutomation(auto) {
    if (!auto) return;
    const canvas = auto.querySelector('.canvas');
    const svg = auto.querySelector('svg.edges');
    const VW = 436.6, VH = 270.5, NH = 36.83;
    function icon(key, c) {
      const A = `fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"`;
      switch (key) {
        case 'file':  return `<svg viewBox="0 0 24 24" ${A}><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16.5h6"/></svg>`;
        case 'code':  return `<svg viewBox="0 0 24 24" ${A}><path d="M9.5 8.5 6 12l3.5 3.5"/><path d="M14.5 8.5 18 12l-3.5 3.5"/></svg>`;
        case 'check': return `<svg viewBox="0 0 24 24" ${A}><circle cx="12" cy="12" r="8.6"/><path d="M8.3 12.4l2.5 2.4 4.9-5.1"/></svg>`;
        case 'tree':  return `<svg viewBox="0 0 24 24" ${A}><rect x="9" y="3.5" width="6" height="5" rx="1.3"/><rect x="3.5" y="15.5" width="6" height="5" rx="1.3"/><rect x="14.5" y="15.5" width="6" height="5" rx="1.3"/><path d="M12 8.5v2.6M6.5 15.5v-2.4h11v2.4"/></svg>`;
        case 'db':    return `<svg viewBox="0 0 24 24" ${A}><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.6 3.1 3 7 3s7-1.4 7-3V6"/><path d="M5 12c0 1.6 3.1 3 7 3s7-1.4 7-3"/></svg>`;
        case 'win':   return `<svg viewBox="0 0 24 24" fill="${c}"><rect x="3.5" y="3.5" width="7.4" height="7.4" rx="1.2"/><rect x="13.1" y="3.5" width="7.4" height="7.4" rx="1.2"/><rect x="3.5" y="13.1" width="7.4" height="7.4" rx="1.2"/><rect x="13.1" y="13.1" width="7.4" height="7.4" rx="1.2"/></svg>`;
        case 'users': return `<svg viewBox="0 0 24 24" ${A}><circle cx="8" cy="8" r="3.2"/><path d="M2.8 19c0-3 2.3-5.2 5.2-5.2S13.2 16 13.2 19"/><path d="M15.5 9h5.5M15.5 13h5.5M15.5 17h5.5"/></svg>`;
        case 'slack': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"><line x1="9.6" y1="3.6" x2="9.6" y2="11"/><line x1="14.4" y1="13" x2="14.4" y2="20.4"/><line x1="3.6" y1="14.4" x2="11" y2="14.4"/><line x1="13" y1="9.6" x2="20.4" y2="9.6"/></svg>`;
      }
      return '';
    }
    const N = {
      fs: { x:16.9,   y:66.74,  w:129.67, label:'Form Submission', tint:'#e8f8ef', color:'#2bbd6b', icon:'file'  },
      ai: { x:64.72,  y:136.28, w:90.67,  label:'AI Agent',        tint:'#efedfe', color:'#7b6ef6', icon:'code'  },
      im: { x:173.52, y:136.32, w:109.67, label:'Is Manager ?',    tint:'#e8f8ef', color:'#2bbd6b', icon:'check' },
      cm: { x:16.72,  y:208.26, w:104.67, label:'Chat Model',      tint:'#eaf1fe', color:'#4b8cf5', icon:'tree'  },
      ed: { x:139.02, y:208.26, w:85.67,  label:'Entra D',         tint:'#eaf1fe', color:'#4b8cf5', icon:'win'   },
      ac: { x:293.51, y:99.49,  w:120.67, label:'Add to channel',  tint:'#fff3e0', color:'#e8a33d', icon:'slack' },
      up: { x:293.51, y:180.42, w:116.67, label:'Update Profile',  tint:'#fff3e0', color:'#e8a33d', icon:'users' }
    };
    Object.entries(N).forEach(([id, n]) => {
      const el = document.createElement('div');
      el.className = 'node';
      el.style.left = (n.x / VW * 100) + '%'; el.style.top = (n.y / VH * 100) + '%';
      el.style.width = (n.w / VW * 100) + '%'; el.style.height = (NH / VH * 100) + '%';
      el.innerHTML = `<span class="ico" style="--tint:${n.tint}">${icon(n.icon, n.color)}</span><span class="lbl">${n.label}</span>`;
      canvas.appendChild(el); n.el = el;
    });
    const EDGES = [
      { id:'e1', to:'ai', d:'M 52 103.57 C 52 140 54 154.7 64.72 154.7' },             // Form Submission → AI Agent
      { id:'e2', to:'im', d:'M 155.39 154.7 L 173.52 154.7' },                          // AI Agent → Is Manager?
      { id:'e3', to:'cm', d:'M 110.06 173.11 C 110.06 196 69.06 188 69.06 208.26' },    // AI Agent → Chat Model
      { id:'e4', to:'ed', d:'M 110.06 173.11 C 110.06 196 181.85 188 181.85 208.26' },  // AI Agent → Entra D
      { id:'e5', to:'ac', d:'M 283.19 154.74 C 288 154.74 288 117.91 293.51 117.91' },  // Is Manager? → Add to channel
      { id:'e6', to:'up', d:'M 283.19 154.74 C 288 154.74 288 198.83 293.51 198.83' }   // Is Manager? → Update Profile
    ];
    const wire = {};
    EDGES.forEach(e => {
      const w = document.createElementNS(svg.namespaceURI, 'path'); w.setAttribute('class', 'wire'); w.setAttribute('d', e.d);
      const f = document.createElementNS(svg.namespaceURI, 'path'); f.setAttribute('class', 'flow'); f.setAttribute('d', e.d);
      const p = document.createElementNS(svg.namespaceURI, 'circle'); p.setAttribute('class', 'packet'); p.setAttribute('r', '2');
      svg.append(w, f, p);
      const len = f.getTotalLength();
      f.style.strokeDasharray = w.style.strokeDasharray = len;
      f.style.strokeDashoffset = w.style.strokeDashoffset = len;
      wire[e.id] = { w, f, p, len, active: false };
    });
    const wait = ms => new Promise(r => setTimeout(r, ms));
    function drawWire(id) {
      const e = wire[id];
      e.w.style.transition = e.f.style.transition = 'stroke-dashoffset .5s ease';
      requestAnimationFrame(() => { e.w.style.strokeDashoffset = '0'; e.f.style.strokeDashoffset = '0'; });
      return new Promise(res => setTimeout(() => { e.active = true; res(); }, 520));
    }
    function resetAll() {
      Object.values(wire).forEach(e => {
        e.active = false; e.w.style.transition = e.f.style.transition = 'none';
        e.w.style.strokeDashoffset = e.f.style.strokeDashoffset = e.len; e.p.style.opacity = '0';
      });
      Object.values(N).forEach(n => n.el.classList.remove('show'));
    }
    function show(id) { N[id].el.classList.add('show'); }
    let t0 = performance.now();
    (function stream(now) {
      if (!auto.isConnected) return;                              // panel closed → stop the loop
      requestAnimationFrame(stream);
      const phase = ((now - t0) % 1500) / 1500;
      Object.values(wire).forEach((e, i) => {
        if (!e.active) { e.p.style.opacity = '0'; return; }
        const t = (phase + i * 0.14) % 1, pt = e.f.getPointAtLength(t * e.len);
        e.p.setAttribute('cx', pt.x); e.p.setAttribute('cy', pt.y);
        e.p.style.opacity = Math.sin(t * Math.PI).toFixed(2);
      });
    })(t0);
    let runId = 0;
    async function run() {
      const my = ++runId;
      const alive = async ms => { await wait(ms); return my === runId && auto.isConnected; };
      resetAll();
      if (!(await alive(420))) return;
      show('fs');                              if (!(await alive(380))) return;
      await drawWire('e1');                    if (my !== runId || !auto.isConnected) return;
      show('ai');                              if (!(await alive(420))) return;
      drawWire('e3'); drawWire('e4');                                     // AI's tools fan out
      if (!(await alive(220))) return;
      show('cm');  if (!(await alive(150))) return;
      show('ed');  if (!(await alive(360))) return;
      await drawWire('e2');                    if (my !== runId || !auto.isConnected) return;   // → Is Manager?
      show('im');                              if (!(await alive(420))) return;
      drawWire('e5'); drawWire('e6');                                     // branch to outputs
      if (!(await alive(220))) return;
      show('ac');   if (!(await alive(150))) return;
      show('up');
      if (!(await alive(4600))) return;
      run();                                                      // loop
    }
    auto.querySelector('.au-replay').addEventListener('click', run);
    run();                                                        // kick off on open (no scroll trigger on the brain)
  }

  // Notes Editor 4: drag a boring-task capsule onto the trash → it flies in, its slot collapses, the
  // bin gulps, the "automated" badge ticks up, and a fresh task slides in from the pool. The capsule is
  // lifted to <body> while dragging so the panel's overflow can't clip it. BRAIN-SPECIFIC: the panel is
  // CSS-scaled, so we capture that effective scale (S) and bake it into the floated capsule's transform
  // (and use offsetHeight for the placeholder) — otherwise the lifted capsule would jump to full size.
  function initAutomationNote(root) {
    if (!root) return;
    const bin = root.querySelector('.a4-bin'), badge = bin.querySelector('.badge'), list = root.querySelector('.a4-list');
    const SEED = [
      'Email reply drafts', 'Database Migration Reviews', 'Calendar management',
      'File renaming and organisation', 'Raising support tickets', 'Analysing logs'
    ];
    const POOL = [
      'Standup status updates', 'Expense report filing', 'Meeting note summaries',
      'Invoice reconciliation', 'Sorting the inbox', 'Scheduling interviews',
      'Weekly metrics reports', 'Following up on emails', 'Formatting documents',
      'Tagging support tickets', 'Backing up old files', 'Updating the changelog',
      'Renaming screenshots', 'Data entry from PDFs', 'Chasing approvals'
    ];
    const MAX = 6;
    let pi = 0, automated = parseInt(badge.textContent, 10) || 0;

    function makeCapsule(text, spawn) {
      const c = document.createElement('div');
      c.className = 'a4-cap' + (spawn ? ' spawn' : '');
      c.textContent = text; c.title = text;
      c.addEventListener('pointerdown', e => startDrag(e, c));
      if (spawn) c.addEventListener('animationend', () => c.classList.remove('spawn'), { once: true });
      return c;
    }
    function refill() {
      while (list.querySelectorAll('.a4-cap:not(.leaving)').length < MAX)
        list.appendChild(makeCapsule(POOL[pi++ % POOL.length], true));
    }
    SEED.forEach(t => list.appendChild(makeCapsule(t, false)));

    let drag = null;
    function overBin(x, y) {
      const r = bin.getBoundingClientRect(), m = 12;                  // a little forgiveness around the can
      return x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m;
    }
    function startDrag(e, cap) {
      if (e.button || cap.classList.contains('leaving')) return;      // primary button only
      e.preventDefault();
      const rect = cap.getBoundingClientRect();
      const nw = cap.offsetWidth, nh = cap.offsetHeight;              // unscaled (layout) size
      const S = rect.height / nh || 1;                               // effective visual scale from the brain transform
      const ph = document.createElement('div');                      // slot-holder (unscaled height so the slot matches)
      ph.className = 'a4-ph';
      ph.style.height = nh + 'px';
      ph.style.marginBottom = getComputedStyle(cap).marginBottom;
      cap.parentNode.insertBefore(ph, cap);
      document.body.appendChild(cap);                                // float above the clipped, scaled panel
      cap.style.position = 'fixed';
      cap.style.left = rect.left + 'px';
      cap.style.top = rect.top + 'px';
      cap.style.width = nw + 'px';
      cap.style.margin = '0';
      cap.style.transformOrigin = 'top left';
      cap.style.transform = `scale(${S})`;                          // render at the same visual size it had in-panel
      cap.classList.add('dragging');
      drag = { cap, ph, sx: e.clientX, sy: e.clientY, over: false, S };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
    function onMove(e) {
      if (!drag) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;       // 1:1 with the pointer (screen px)
      drag.cap.style.transform = `translate(${dx}px, ${dy}px) scale(${drag.S * 1.06}) rotate(-1.5deg)`;
      drag.over = overBin(e.clientX, e.clientY);
      bin.classList.toggle('over', drag.over);
    }
    function onUp() {
      if (!drag) return;
      const { cap, ph, over, S } = drag;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      bin.classList.remove('over');
      cap.classList.remove('dragging');
      drag = null;
      if (over) toss(cap, ph, S); else springBack(cap, ph, S);
    }
    // miss → glide back to the slot, then settle as a normal in-flow capsule again
    function springBack(cap, ph, S) {
      void cap.offsetWidth;
      cap.style.transition = 'transform .34s var(--ease-spring)';
      cap.style.transform = `translate(0px, 0px) scale(${S})`;
      let done = false;
      const land = () => {
        if (done) return; done = true;
        cap.removeEventListener('transitionend', land);
        if (ph.parentNode) ph.parentNode.insertBefore(cap, ph);
        ph.remove();
        cap.removeAttribute('style');                                // drop the fixed positioning
      };
      cap.addEventListener('transitionend', land);
      setTimeout(land, 420);                                         // safety net
    }
    // hit → fly into the can, collapse the slot, tick the badge, refill
    function toss(cap, ph, S) {
      cap.classList.add('leaving');
      const L0 = parseFloat(cap.style.left), T0 = parseFloat(cap.style.top);
      const nw = cap.offsetWidth, nh = cap.offsetHeight, fs = S * 0.14;   // final scale
      const br = bin.getBoundingClientRect();
      const tx = (br.left + br.width / 2) - (nw * fs) / 2 - L0;       // land the (scaled) centre on the can's mouth
      const ty = (br.top + br.height * 0.42) - (nh * fs) / 2 - T0;
      void cap.offsetWidth;
      cap.style.transition = 'transform .44s cubic-bezier(.5,.02,.8,.2), opacity .44s ease';
      cap.style.transform = `translate(${tx}px, ${ty}px) scale(${fs}) rotate(10deg)`;
      cap.style.opacity = '0';
      // close the slot it left behind
      ph.style.transition = 'height .34s var(--ease-soft), margin .34s var(--ease-soft)';
      void ph.offsetWidth;
      ph.style.height = '0'; ph.style.marginBottom = '0';
      setTimeout(() => ph.remove(), 360);
      bin.classList.remove('gulp'); void bin.offsetWidth; bin.classList.add('gulp');
      automated++; badge.textContent = automated;
      badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');
      refill();                                                      // a fresh task slides in as this one flies away
      let removed = false;
      const drop = () => { if (removed) return; removed = true; cap.remove(); };
      cap.addEventListener('transitionend', e => { if (e.propertyName === 'transform') drop(); });
      setTimeout(drop, 700);                                         // safety net if transitionend is missed
    }
  }

  // fast typewriter: type a note → hold → reverse-erase → next → loop. Stops once el is removed.
  function typewriter(el, notes, { type = 30, erase = 14, hold = 5000, gap = 550 } = {}) {
    const text = document.createTextNode(''), caret = document.createElement('span');
    caret.className = 'caret'; el.append(text, caret);
    let n = 0; const jitter = () => type * (0.5 + Math.random());
    (function typeNote() {
      const s = notes[n]; let i = 0;
      (function step() {
        if (!el.isConnected) return;
        text.nodeValue = s.slice(0, i);
        if (i++ <= s.length) setTimeout(step, jitter());
        else setTimeout(eraseNote, hold);
      })();
    })();
    function eraseNote() {
      if (!el.isConnected) return;
      const s = text.nodeValue; let i = s.length;
      (function step() {
        if (!el.isConnected) return;
        text.nodeValue = s.slice(0, i);
        if (i-- > 0) setTimeout(step, erase);
        else { n = (n + 1) % notes.length; setTimeout(restart, gap); }
      })();
    }
    function restart() {
      const s = notes[n]; let i = 0;
      (function step() {
        if (!el.isConnected) return;
        text.nodeValue = s.slice(0, i);
        if (i++ <= s.length) setTimeout(step, jitter());
        else setTimeout(eraseNote, hold);
      })();
    }
  }

  // reCAPTCHA: click box → spinner → green tick (click again resets).
  function initCaptcha(rc) {
    if (!rc) return;
    const box = rc.querySelector('.checkbox'); let state = 'idle';
    box.addEventListener('click', () => {
      if (state === 'checking') return;
      if (state === 'done') { rc.classList.remove('done'); rc.setAttribute('aria-checked','false'); state = 'idle'; return; }
      state = 'checking'; rc.classList.add('checking');
      setTimeout(() => { rc.classList.remove('checking'); rc.classList.add('done'); rc.setAttribute('aria-checked','true'); state = 'done'; }, 750);
    });
  }

  /* ── build the kept manifestations ──
     8 manifestations evenly spaced (45° apart) around the brain: Podcast · GPU Monitor ·
     AI Leaderboard · Terminal · and 4 folders (2 on the right hemisphere, 2 on the left). */
  function setupPanels() {
    // Every panel is GLUED to a distinct region of the brain surface — distributed all
    // the way around it (frontal, temporal, parietal, occipital …) on a ring. The brain
    // is world-fixed and the camera orbits it, so each panel orbits WITH the brain:
    // the ones on the face turned toward you are visible, and as it rotates they swing to
    // the back and fade while others come round into view — exactly like thoughts stuck
    // to different lobes. Azimuths are 45° apart with ALTERNATING heights, so the handful
    // visible across the front are always staggered and never overlap each other.
    // Spread over the sphere: an UPPER band and a LOWER band, alternating around the ring
    // so neighbours are never at the same height (→ no overlap). Folders + data panels are
    // mixed across both bands (2 folders up, 2 down; 2 folders right, 2 left). surfaceAnchor
    // clamps recesses to the brain's outer envelope, so every panel sits on the EXTERIOR.
    const UP = 0.27, DN = -0.22;
    // make sure the mesh is in its resting tilt before we raycast surface points onto it
    brainModel.rotation.set(parseFloat(inputs.tiltX.value), parseFloat(inputs.tiltY.value), parseFloat(inputs.tiltZ.value));
    brainModel.updateMatrixWorld(true);
    // phiDeg: 0 = front, 45..135 = RIGHT flank, 180 = back, 225..315 = LEFT flank.
    // data panels are 25% bigger (scale 1.25); folders 50% bigger (scale 1.5)
    const PANEL = 1.25, FOLDER = 1.5;
    const place = (build, phiDeg, y, scale = PANEL) => {
      const p = phiDeg * Math.PI / 180;
      addAnchored(build, surfaceAnchor(new THREE.Vector3(Math.sin(p), y, Math.cos(p))), scale);
    };
    place(buildPodcast(),          0, UP);           // front — upper
    place(buildThingsAi(),        45, DN, FOLDER);   // RIGHT — folder (lower)
    place(buildProductsBuild(),   90, UP, FOLDER);   // RIGHT — folder (upper)
    place(buildTerminal(),       180, UP, 1.55);      // back — upper (enlarged)
    place(buildAutomations(),    225, DN, FOLDER);   // LEFT — folder (lower)
    place(buildIdeas2am(),       270, UP, FOLDER);   // LEFT — folder (upper)
    place(buildModel(),          315, DN);           // LEFT — leaderboard (lower)
    place(buildTokens(),         315, 0.80, 1.05);    // UPPER-LEFT — elevated above the leaderboard, balancing the right cluster

    // EASTER EGG: the hidden "Forbidden Vault" lives on the BACK of the brain (phi=180), so a
    // half-turn brings it face-on. It's the hero of that view (bigger scale) and is excluded from
    // the normal frustum-fade — its opacity is driven by the reveal state instead.
    const vp = VAULT_VIEW_AZIMUTH_DEG * Math.PI / 180;   // faces the camera at the reveal's side-view azimuth
    vaultEntry = addAnchored(buildVault(),
      surfaceAnchor(new THREE.Vector3(Math.sin(vp), 0.12, Math.cos(vp))), FOLDER, { isVault:true, skipOpacity:true });

    // give every folder its frosted-glass panes (cosmetic; never the vault/data panels)
    document.querySelectorAll('.panel.folder').forEach(addFolderGlass);
  }

  // GLASSMORPHISM: behind each folder icon, a pane that backdrop-blurs the brain through
  // the folder's silhouette; in front, a pane with a light sheen. Both masked to the
  // folder's own PNG, pointer-events:none, purely cosmetic — added once, after the img,
  // so z-index (not DOM order) sets paint order and the fan/click logic is untouched.
  function addFolderGlass(folderEl) {
    const img = folderEl.querySelector(':scope > img');
    if (!img || folderEl.querySelector(':scope > .fglass')) return;
    const mask = `url("${img.getAttribute('src')}")`;
    ['fglass', 'fsheen'].forEach(cls => {
      const g = document.createElement('div');
      g.className = cls;
      g.style.setProperty('--mask', mask);
      folderEl.appendChild(g);
    });
  }

  function mk(cls, html){ const d=document.createElement('div'); d.className='panel '+cls; d.innerHTML=html; panelsLayer.appendChild(d); return d; }

  /* ── FOLDERS (Figma glass icons) → files fan up out of the folder (macOS fan view) ── */
  function folder(img, label, files, isPage) {
