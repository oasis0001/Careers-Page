<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrainOS — Inside an AI Nerd's Mind</title>
<!--
  BrainOS. The ASCII brain core is pulled DIRECTLY from dither_brain.html
  (that file is left untouched): exact rendering, sizing, OrbitControls
  click-drag, camera feel.

  Manifestations (folders / terminal / model card / podcast)
  are HTML elements anchored to fixed 3D points around the brain and re-projected
  to screen space every frame — so they are children of the brain: when you drag
  the brain (orbit the camera) every panel rotates, repositions, rescales and
  changes depth with it, fading away as it passes behind. No wires, no connectors.

  Run via a local server (GLB + ES modules need HTTP):
    python3 -m http.server 8000  →  http://localhost:8000/BrainOS/
-->
<style>
  :root{
    --text:#eef0f6; --muted:#7a7e8c; --muted-2:#4a4d59;
    --panel:#0c0d12; --panel-2:#101218; --border:#1c1d26; --border-hot:#2c3350;
    --blue:#6b9bff; --blue-soft:#8fb0ff; --green:#3dffa3;
    --ease-spring:cubic-bezier(.16,1.3,.3,1); --ease-soft:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#000;                      /* clean, deep black — no grid */
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,"Cascadia Code",monospace;}

  /* the reference control panel — kept (hidden) so the ported brain script runs verbatim */
  #controls{ display:none; }

  /* One shared stacking context for the brain + panels, so a panel can sit IN FRONT OF
     (near side) or BEHIND (far side) the opaque brain canvas. */
  #scene{
    position:fixed; inset:0;
    background:
      radial-gradient(closest-side at 50% 50%, rgba(20,26,44,.45), rgba(0,0,0,0) 70%),
      #000;
  }
  #displayCanvas{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:10;                           /* brain sits between near panels (20) and far panels (5) */
    image-rendering:pixelated;
    max-width:95%; max-height:95%;        /* EXACT sizing from dither_brain.html (intrinsic 1440×750) */
    cursor:grab; touch-action:none;
  }
  #displayCanvas:active{ cursor:grabbing; }

  /* panel layer creates NO stacking context (no z-index) → each panel's z-index competes
     directly with the brain canvas, so far-side panels can drop behind it. */
  #panels{ position:absolute; inset:0; pointer-events:none; }
  .panel{ position:absolute; left:0; top:0; opacity:0; will-change:transform,left,top,opacity;
          transform:translate(-50%,-50%); pointer-events:auto; }

  /* solid cards — fully opaque so the brain never shows through them */
  .card{
    background:linear-gradient(180deg, #13151d, #0a0b10);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    box-shadow:0 16px 46px rgba(0,0,0,.7);
    position:relative; overflow:hidden; transition:border-color .4s, box-shadow .4s, background .4s;
  }
  .panel:hover .card{ border-color:var(--border-hot);
    background:linear-gradient(180deg, #1a1d27, #0d0f15);
    box-shadow:0 26px 74px rgba(0,0,0,.75), 0 0 0 1px rgba(107,155,255,.22), 0 0 40px rgba(107,155,255,.12); }
  .title{ font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--muted);
          display:flex; align-items:center; gap:7px; }
  .dot{ width:6px;height:6px;border-radius:50%; background:var(--muted-2); transition:background .3s, box-shadow .3s; }
  .panel:hover .dot{ background:var(--green); box-shadow:0 0 8px var(--green); }

  /* terminal */
  .term{ width:212px; }
  .term .bar{ display:flex; align-items:center; gap:5px; padding:6px 10px; background:#0c0e12; border-bottom:1px solid var(--border);}
  .term .tl{ width:9px;height:9px;border-radius:50%; }
  .term .tl.r{background:#ff5f56}.term .tl.y{background:#ffbd2e}.term .tl.g{background:#27c93f}
  .term .bar .name{ margin-left:6px; font-size:9.5px; color:var(--muted); }
  .term .scr{ height:120px; overflow:hidden; padding:8px 10px; font-size:10px; line-height:1.5;
              color:var(--green); background:radial-gradient(120% 100% at 0 0,#0a0e0c,#070908); }
  .term .scr .ln{ white-space:pre-wrap; word-break:break-word; }
  .term .scr .ln.sys{ color:#5b7d6e; } .term .scr .ln.ok{ color:#9dffce; }
  .term .scr .cursor{ display:inline-block; width:8px;height:14px; background:var(--green); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{50%{opacity:0}}
  .term-on .card{ box-shadow:0 0 0 1px rgba(61,255,163,.35), 0 0 50px rgba(61,255,163,.18), 0 26px 70px rgba(0,0,0,.6);}

  /* folders — glassy icons exported from Figma (label + glow baked in, transparent bg) */
  .folder{ width:152px; cursor:pointer; user-select:none; }
  .folder img{ width:152px; display:block; filter:drop-shadow(0 14px 24px rgba(0,0,0,.4)); transition:transform .5s var(--ease-spring); }
  .folder:hover img{ transform:translateY(-6px) scale(1.05); }

  /* shared macOS-window chrome for the Figma panels */
  .win{ border:1px solid #5c5c5c; border-radius:14px; overflow:hidden;
        background:linear-gradient(180deg,#101010 80%, #4a4a4a 220%); }
  .win .tbar{ height:22px; background:#292828; display:flex; align-items:center; gap:5px; padding:0 10px; }
  .win .tbar i{ width:7px; height:7px; border-radius:50%; background:#565656; }
  .win .hd{ display:flex; align-items:center; gap:7px; padding:11px 14px 7px; }
  .win .hd .gdot{ width:7px; height:7px; border-radius:50%; background:#00be6f; box-shadow:0 0 6px #00be6f; flex:none; }
  .win .hd .t{ font-size:16px; font-weight:600; letter-spacing:-0.4px; color:#fff; }
  .panel:hover .win{ border-color:#7d7d7d; box-shadow:0 0 0 1px rgba(0,190,111,.22), 0 0 34px rgba(0,190,111,.12), 0 22px 60px rgba(0,0,0,.6); }

  /* AI Leaderboard */
  .board{ width:236px; }
  .board .rows{ padding:2px 12px 13px; display:flex; flex-direction:column; gap:6px; position:relative; }
  .board .row{ display:flex; align-items:center; gap:8px; background:#1b1b1b; border-radius:8px; padding:5px;
    transition:transform .55s var(--ease-spring); }
  .board .row .rk{ width:26px; height:26px; flex:none; background:#313131; border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:300; }
  .board .row .nm{ flex:1; font-size:14px; color:#fff; font-weight:300; letter-spacing:-0.3px; }
  .board .row .sc{ font-size:14px; color:#00be6f; font-weight:600; padding-right:7px; font-variant-numeric:tabular-nums; }

  /* folder-to-folder connection lines (electric blue, glowing) — drawn between folders only */
  #folderLinks{ position:absolute; inset:0; z-index:15; pointer-events:none;
    filter:drop-shadow(0 0 3px rgba(70,110,255,.9)); overflow:visible; }
  #folderLinks line{ stroke:#3a5bff; stroke-width:2; stroke-linecap:round; }
  #folderLinks rect{ fill:#6f93ff; }

  /* "IN MY BRAIN" — fixed bottom-right HUD with live hemisphere counts */
  #mind{ position:fixed; right:26px; bottom:26px; z-index:60; width:330px;
    border:1px solid #2f44ff; background:#000; border-radius:2px; overflow:hidden;
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,"Cascadia Code",monospace;
    box-shadow:0 0 30px rgba(47,68,255,.25); user-select:none; }
  #mind .mind-hd{ background:#2433ff; color:#fff; font-size:12px; font-weight:700;
    letter-spacing:1.2px; padding:6px 12px; }
  #mind .mind-body{ display:flex; }
  #mind .mind-col{ flex:1; padding:11px 14px 13px; }
  #mind .mind-col + .mind-col{ border-left:1px solid #2f44ff; }
  #mind .mind-ch{ font-size:10.5px; letter-spacing:.8px; color:#fff; padding-bottom:7px;
    margin-bottom:9px; border-bottom:1px solid #2f44ff; }
  #mind .mind-row{ display:flex; justify-content:space-between; gap:14px; font-size:10.5px;
    letter-spacing:.4px; line-height:1.9; }
  #mind .mind-row .k{ color:#8aa0ff; }
  #mind .mind-row .v{ color:#fff; font-variant-numeric:tabular-nums; }

  /* GPU Monitor */
  .gpu{ width:236px; }
  .gpu .body{ padding:0 14px 13px; }
  .gpu .row{ display:flex; align-items:flex-end; justify-content:space-between; }
  .gpu .row .lbl{ font-size:14px; color:#fff; font-weight:300; }
  .gpu .row .big{ font-size:32px; color:#00be6f; font-weight:600; line-height:.9; font-variant-numeric:tabular-nums; }
  .gpu canvas{ width:100%; height:62px; display:block; margin-top:8px; border-radius:6px; }

  /* Podcast */
  .pod{ width:288px; }
  .pod .body{ padding:11px 13px 13px; }
  .pod .np{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#fff; }
  .pod .np .gdot{ width:6px;height:6px;border-radius:50%; background:#00be6f; box-shadow:0 0 6px #00be6f; }
  .pod .grid{ display:flex; gap:12px; margin-top:11px; }
  .pod .cover{ width:104px; height:104px; flex:none; border-radius:9px; background:#305eff; position:relative;
    padding:9px; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; }
  .pod .cover .ct{ font-size:9.5px; line-height:1.08; color:#fff; font-weight:600; }
  .pod .cover .ca{ font-size:14px; color:#fff; font-weight:800; letter-spacing:-0.3px; }
  .pod .cover .arc{ position:absolute; right:-46px; bottom:-46px; width:128px; height:128px; border-radius:50%; border:1px solid rgba(255,255,255,.35); }
  .pod .cover .play{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.9); color:#000;
    display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; }
  .pod .right{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .pod .right .h{ font-size:16px; font-weight:800; line-height:1.0; letter-spacing:-0.4px; color:#fff; }
  .pod .right .a{ font-size:11px; color:#c8c8c8; margin-top:5px; }
  .pod .wave{ display:flex; align-items:center; gap:2px; height:26px; margin-top:auto; }
  .pod .wave i{ width:3px; background:#d9d9d9; border-radius:2px; height:18%; }
  .pod .snip{ font-size:10px; color:#c8c8c8; margin-top:6px; font-style:italic; transition:opacity .3s; }


  /* macOS "fan" files — children of the folder that rise UP out of it in an arc */
  .fanfile{ position:absolute; left:50%; top:30px;      /* start at the folder's paper slot, inside it */
    width:142px; min-height:80px;
    background:linear-gradient(180deg,#ffffff,#e7e8ee); border:1px solid rgba(0,0,0,.10);
    color:#17171b; font-size:11.5px; font-weight:600; line-height:1.3;
    padding:26px 13px 13px; border-radius:9px; display:flex; align-items:flex-end;
    box-shadow:0 16px 32px rgba(0,0,0,.5);
    transform-origin:center bottom; pointer-events:none;
    transform:translate(-50%,6px) scale(.3); opacity:0;
    transition:transform .6s var(--ease-spring), opacity .4s ease; }
  .fanfile.open{ opacity:1; }
  .fanfile .ic{ position:absolute; top:9px; left:13px; font-size:14px; color:#5b8cff; }
  .fanfile.page .ic{ color:#8a6bff; }


  /* minimal HUD */
  .hud{ position:fixed; z-index:40; font-size:11px; letter-spacing:.5px; opacity:.85; }
  #brand{ top:24px; right:28px; text-align:right; }
  #brand .b{ font-size:15px; font-weight:700; }
  #brand .b .ld{ display:inline-block; width:7px;height:7px;border-radius:50%; background:var(--green);
    margin-right:6px; box-shadow:0 0 8px var(--green); vertical-align:1px; animation:pulse 1.7s infinite; }
  #brand .s{ color:var(--muted); font-size:10px; letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  #hint{ bottom:22px; left:50%; transform:translateX(-50%); color:var(--muted-2); letter-spacing:1px; text-align:center; }

  #status{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:70;
    background:rgba(8,9,13,.85); border:1px solid var(--border); color:var(--muted);
    padding:14px 20px; border-radius:12px; font-size:13px; text-align:center; max-width:460px; pointer-events:none; }
  #status code{ background:#1a1c24; color:#ffd97a; padding:2px 6px; border-radius:4px; font-size:12px; }
  #status.error{ border-color:#5a2b2b; color:#ff9a8a; }
  #status.ok{ display:none; }
</style>
</head>
<body>

<!-- Reference control panel: hidden, present only so the ported brain script reads inputs exactly as in dither_brain.html -->
<div id="controls">
  <select id="charset"><option value="minimal" selected>minimal</option></select>
  <input type="color" id="tintColor" value="#C8C8C8">
  <input type="range" id="tones" value="2">
  <input type="range" id="highlight" value="1.0">
  <input type="range" id="resolution" value="9">
  <input type="range" id="contrast" value="2.3">
  <input type="range" id="threshold" value="1.7">
  <input type="range" id="shadowLift" value="28">
  <input type="range" id="noise" value="7">
  <input type="range" id="fps" value="60">
  <input type="range" id="rotY" value="0.42">
  <input type="range" id="rotX" value="0">
  <input type="range" id="rotZ" value="0">
  <input type="range" id="tiltX" value="0">
  <input type="range" id="tiltY" value="-1.2">
  <input type="range" id="tiltZ" value="0">
  <input type="range" id="zoom" value="1.0">
  <input type="color" id="modelColor" value="#cfcfcf">
  <input type="range" id="lightIntensity" value="6">
</div>

<div id="scene">
  <canvas id="displayCanvas"></canvas>
  <svg id="folderLinks" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="panels"></div>
</div>

<!-- bottom-right HUD: live count of "thoughts" running in each hemisphere -->
<div id="mind">
  <div class="mind-hd">IN MY BRAIN</div>
  <div class="mind-body">
    <div class="mind-col">
      <div class="mind-ch">LEFT HEMISPHERE</div>
      <div class="mind-row"><span class="k">TASKS RUNNING</span><span class="v" data-base="40"  data-jit="14">40</span></div>
      <div class="mind-row"><span class="k">TO BE STARTED</span><span class="v" data-base="5000" data-jit="0">5000</span></div>
    </div>
    <div class="mind-col">
      <div class="mind-ch">RIGHT HEMISPHERE</div>
      <div class="mind-row"><span class="k">TASKS RUNNING</span><span class="v" data-base="660" data-jit="40">660</span></div>
      <div class="mind-row"><span class="k">TO BE STARTED</span><span class="v" data-base="890" data-jit="0">890</span></div>
    </div>
  </div>
</div>

<div id="brand" class="hud">
  <div class="b"><span class="ld"></span>BrainOS</div>
  <div class="s">a mind that won't stop building</div>
</div>
<div id="hint" class="hud">drag to rotate the mind · hover a hemisphere · click the folders</div>

<div id="status">Initializing consciousness…</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  /* ════════════════════════════════════════════════════════════════════
     BRAIN CORE — ported directly from dither_brain.html (unchanged behaviour)
     ════════════════════════════════════════════════════════════════════ */
  const AUTO_ROTATE_SPEED  = 0.8;    // ← idle spin speed. Higher = faster. Set 0 to stop.
  const VERTICAL_LIMIT_DEG = 25;
  const DRAG_SENSITIVITY   = 1.0;

  // ╔═══════════════════════════════════════════════════════════════════╗
  // ║  BRAIN_ZOOM  —  this is the knob to make the brain BIGGER/SMALLER.  ║
  // ║  Camera distance = baseDistance × BRAIN_ZOOM.                       ║
  // ║  LOWER  = zoom IN  = bigger brain  (don't go below ~0.80 or the     ║
  // ║           brain starts to clip top/bottom).                         ║
  // ║  HIGHER = zoom OUT = smaller brain.                                 ║
  // ╚═══════════════════════════════════════════════════════════════════╝
  const BRAIN_ZOOM = 1.0;   // 1.0 = bounding sphere fits the framebuffer at EVERY rotation (no clipping)

  const DEBUG_REGIONS = false;
  const REGION = { splitAxis: 'x', splitSign: 1, splitAt: 0.5 };
  const HIGHLIGHT = { tintBlend: 0.0 };
  const REGION_DEBUG_COLORS = ['#ff5555', '#5599ff'];
  const REGION_LEFT = 0, REGION_RIGHT = 1;

  const displayCanvas = document.getElementById('displayCanvas');
  const ctx = displayCanvas.getContext('2d', { alpha: true });
  const statusEl = document.getElementById('status');
  function setStatus(msg, kind = '') { statusEl.innerHTML = msg; statusEl.className = kind; }

  const isFileProtocol = location.protocol === 'file:';
  if (isFileProtocol) {
    setStatus('Open this page via a local server, not <code>file://</code>.<br>' +
      'Run <code>python3 -m http.server 8000</code>, then open <code>http://localhost:8000/BrainOS/</code>.', 'error');
  } else { setStatus('Loading 3D model…'); }

  const offscreenCanvas = document.createElement('canvas');
  const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

  const charSets = {
    ascii:   "Ñ@#W$9876543210?!abc;:+=-,._ ",
    blocks:  "█▓▒░ ", binary: "10 ", minimal: "#*+-. "
  };

  const inputs = {
    resolution: el('resolution'), noise: el('noise'), fps: el('fps'), threshold: el('threshold'),
    contrast: el('contrast'), shadowLift: el('shadowLift'), tones: el('tones'), highlight: el('highlight'),
    charset: el('charset'), tintColor: el('tintColor'), rotY: el('rotY'), rotX: el('rotX'), rotZ: el('rotZ'),
    tiltX: el('tiltX'), tiltY: el('tiltY'), tiltZ: el('tiltZ'), zoom: el('zoom'),
    modelColor: el('modelColor'), lightIntensity: el('lightIntensity'),
  };
  function el(id){ return document.getElementById(id); }

  const threeCanvas = document.createElement('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 3);

  RectAreaLightUniformsLib.init();
  const areaLight = new THREE.RectAreaLight(0xffffff, 6, 6, 6);
  areaLight.position.set(6, 1, -4); areaLight.lookAt(0, 0, 0); scene.add(areaLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.45);
  fillLight.position.set(-5, 1.5, 2); scene.add(fillLight); scene.add(fillLight.target);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x0a0a10, 0.2));

  const keyLightOffset = new THREE.Vector3(), fillLightOffset = new THREE.Vector3();
  function updateLightRig() {
    camera.updateMatrixWorld();
    areaLight.position.copy(keyLightOffset).applyMatrix4(camera.matrixWorld); areaLight.lookAt(0, 0, 0);
    fillLight.position.copy(fillLightOffset).applyMatrix4(camera.matrixWorld);
  }

  const brainGroup = new THREE.Group(); scene.add(brainGroup);

  const controls = new OrbitControls(camera, displayCanvas);
  controls.target.set(0, 0, 0);
  controls.enablePan = false; controls.enableZoom = false;
  controls.enableDamping = true; controls.dampingFactor = 0.045;
  controls.rotateSpeed = DRAG_SENSITIVITY * 0.7;
  // Auto-rotate ON — the brain idly spins and every attached panel orbits with it.
  controls.autoRotate = true; controls.autoRotateSpeed = AUTO_ROTATE_SPEED;
  const polarHalfRange = THREE.MathUtils.degToRad(VERTICAL_LIMIT_DEG);
  controls.minPolarAngle = Math.PI / 2 - polarHalfRange;
  controls.maxPolarAngle = Math.PI / 2 + polarHalfRange;

  let brainModel = null, baseDistance = 3, isBrainLoaded = false;
  let currentModelColor = inputs.modelColor.value;
  let brainMesh = null, brainGeometry = null, brainMaterial = null;
  let modelRadius = 1;                     // max dimension — used to scale panel anchors

  function classifyRegions(geometry) {
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox, min = bb.min, size = new THREE.Vector3().subVectors(bb.max, bb.min);
    const pos = geometry.getAttribute('position'), n = pos.count;
    const region = new Float32Array(n);
    const colors = DEBUG_REGIONS ? new Float32Array(n * 3) : null;
    const dbg = DEBUG_REGIONS ? REGION_DEBUG_COLORS.map(h => new THREE.Color(h)) : null;
    const axis = REGION.splitAxis;
    const get = axis === 'x' ? 'getX' : axis === 'y' ? 'getY' : 'getZ';
    const s = axis === 'x' ? size.x : axis === 'y' ? size.y : size.z;
    const m = axis === 'x' ? min.x : axis === 'y' ? min.y : min.z;
    for (let i = 0; i < n; i++) {
      let t = s ? (pos[get](i) - m) / s : 0.5;
      if (REGION.splitSign < 0) t = 1 - t;
      const id = t < REGION.splitAt ? REGION_LEFT : REGION_RIGHT;
      region[i] = id;
      if (colors) { const c = dbg[id]; colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b; }
    }
    geometry.setAttribute('region', new THREE.BufferAttribute(region, 1));
    if (colors) geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  }

  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
  dracoLoader.setDecoderConfig({ type: 'js' });
  const gltfLoader = new GLTFLoader(); gltfLoader.setDRACOLoader(dracoLoader);

  gltfLoader.load('Brain.glb', (gltf) => {
    brainModel = gltf.scene;
    brainModel.traverse(node => {
      if (node.isMesh) {
        const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(currentModelColor), roughness: 0.78, metalness: 0.0 });
        if (DEBUG_REGIONS) mat.vertexColors = true;
        node.material = mat; brainMesh = node; brainGeometry = node.geometry; brainMaterial = mat;
      }
    });
    const box = new THREE.Box3().setFromObject(brainModel);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    brainModel.position.sub(center);
    if (brainGeometry) classifyRegions(brainGeometry);
    const maxDim = Math.max(size.x, size.y, size.z); modelRadius = maxDim;
    const fovRad = (camera.fov * Math.PI) / 180;
    baseDistance = (maxDim / (2 * Math.tan(fovRad / 2)));
    brainGroup.add(brainModel);
    camera.position.set(0, 0, baseDistance * BRAIN_ZOOM);
    controls.update();
    camera.updateMatrixWorld();
    keyLightOffset.copy(areaLight.position).applyMatrix4(camera.matrixWorld.clone().invert());
    fillLightOffset.copy(fillLight.position).applyMatrix4(camera.matrixWorld.clone().invert());
    isBrainLoaded = true; setStatus('', 'ok');
    setupPanels();                          // build the anchored manifestations now that we know modelRadius
    setupFolderLinks();                     // wire up the folder-to-folder connection lines
    animateMindPanel();                     // start the "IN MY BRAIN" live counters
  },
  (xhr) => { if (isFileProtocol) return; if (xhr.lengthComputable) setStatus(`Loading 3D model… ${Math.round((xhr.loaded/xhr.total)*100)}%`); },
  (err) => { console.error('Failed to load Brain.glb:', err); if (isFileProtocol) return;
    setStatus('Failed to load <code>Brain.glb</code>. Check the console for details.', 'error'); });

  const W = 1440, H = 750;
  displayCanvas.width = W; displayCanvas.height = H;
  offscreenCanvas.width = W; offscreenCanvas.height = H;
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : { r: 255, g: 255, b: 255 };
  }

  let lastDrawTime = performance.now(), lastFrameTime = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - lastFrameTime) / 1000); lastFrameTime = now;

    if (isBrainLoaded) {
      brainModel.rotation.set(parseFloat(inputs.tiltX.value), parseFloat(inputs.tiltY.value), parseFloat(inputs.tiltZ.value));
      controls.update(dt);
      updateLightRig();
      updatePanels();                       // ← project the attached manifestations every frame
      renderer.render(scene, camera);
    }

    const fps = parseInt(inputs.fps.value);
    if (now - lastDrawTime < 1000 / fps) return;
    lastDrawTime = now;

    offCtx.clearRect(0, 0, W, H);
    if (isBrainLoaded) offCtx.drawImage(threeCanvas, 0, 0, W, H);

    drawDither();
  }

  function drawDither() {
    const res = parseInt(inputs.resolution.value);
    const noiseLvl = parseInt(inputs.noise.value);
    const thresh = parseFloat(inputs.threshold.value);
    const contrast = parseFloat(inputs.contrast.value);
    const shadowLift = parseInt(inputs.shadowLift.value);
    const tones = parseInt(inputs.tones.value);
    const highlight = parseFloat(inputs.highlight.value);
    const tint = hexToRgb(inputs.tintColor.value);
    const mode = inputs.charset.value === 'halftone' ? 'halftone' : 'ascii';
    const density = charSets[inputs.charset.value] || charSets.minimal;

    // Transparent canvas: paint ONLY the brain silhouette (opaque). Everything outside
    // stays clear, so a panel sitting behind the brain (lower z-index) is occluded only
    // by the brain SHAPE — it tucks partly behind the brain instead of vanishing.
    ctx.clearRect(0, 0, W, H);
    ctx.font = `bold ${res}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (!isBrainLoaded) return;

    const pixels = offCtx.getImageData(0, 0, W, H).data;
    for (let y = 0; y < H; y += res) {
      for (let x = 0; x < W; x += res) {
        const index = (y * W + x) * 4;
        const r = pixels[index], g = pixels[index+1], b = pixels[index+2], a = pixels[index+3];
        if (a < 128) continue;
        // fill this brain cell solid + opaque → builds a solid silhouette occluder;
        // the dithered glyph is drawn on top of it below.
        ctx.fillStyle = "#000"; ctx.fillRect(x, y, res, res);
        const srcLum = r * 0.299 + g * 0.587 + b * 0.114;
        let brightness = srcLum;
        brightness = ((brightness / 255 - 0.5) * contrast + 0.5) * 255;
        brightness = brightness + shadowLift * (1 - Math.max(0, Math.min(255, brightness)) / 255);
        const noise = (Math.random() - 0.5) * noiseLvl;
        brightness = (brightness * thresh) + noise;
        brightness = Math.max(0, Math.min(255, brightness));
        if (brightness < 10) continue;
        const lvl = Math.min(tones - 1, Math.floor((brightness / 255) * tones));
        const intensity = (lvl === tones - 1) ? highlight : (lvl + 1) / tones;
        let cr, cg, cb;
        const chroma = Math.max(r, g, b) - Math.min(r, g, b);
        if (chroma < 18) { cr = tint.r * intensity; cg = tint.g * intensity; cb = tint.b * intensity; }
        else {
          const norm = srcLum > 0 ? intensity / (srcLum / 255) : intensity;
          cr = r * norm; cg = g * norm; cb = b * norm;
          const tb = HIGHLIGHT.tintBlend;
          if (tb > 0) { cr = cr*(1-tb)+tint.r*intensity*tb; cg = cg*(1-tb)+tint.g*intensity*tb; cb = cb*(1-tb)+tint.b*intensity*tb; }
        }
        const col = `rgb(${Math.min(255,cr)|0}, ${Math.min(255,cg)|0}, ${Math.min(255,cb)|0})`;
        const cx = x + res/2, cy = y + res/2;
        if (mode === 'halftone') {
          ctx.lineWidth = Math.max(0.5, intensity * res * 0.2); ctx.strokeStyle = col;
          ctx.beginPath(); ctx.arc(cx, cy, res * 0.42, 0, Math.PI * 2); ctx.stroke();
        } else {
          const charIndex = Math.floor((1 - intensity) * (density.length - 1));
          ctx.fillStyle = col; ctx.fillText(density[charIndex], cx, cy);
        }
      }
    }
  }
  requestAnimationFrame(loop);

  /* ════════════════════════════════════════════════════════════════════
     ANCHORED MANIFESTATIONS — HTML children of the brain
     Each entry has a fixed 3D anchor (in brain-centred world space). The brain
     is world-fixed and the CAMERA orbits it (OrbitControls), so re-projecting
     these anchors every frame makes the panels move/scale/depth-sort/fade WITH
     the brain exactly as if they were welded to its surface. No wires.
     ════════════════════════════════════════════════════════════════════ */
  const panelsLayer = document.getElementById('panels');
  const PANELS = [];                  // {el, anchor:Vector3, scale, opacity, hover}
  const _v = new THREE.Vector3();
  const PANEL_SCALE = 0.54;           // small → the brain stays the hero, panels fit on its flanks
  const IDLE_OPACITY = 1.0;           // fully opaque — the brain never shows through a panel

  function addAnchored(elm, anchorVec, scale = 1, opts = {}) {
    const entry = { el: elm, anchor: anchorVec, scale, opacity: 0, hover: false, ...opts };
    elm.addEventListener('pointerenter', () => entry.hover = true);
    elm.addEventListener('pointerleave', () => entry.hover = false);
    PANELS.push(entry); return entry;
  }
  function removeAnchored(entry) {
    const i = PANELS.indexOf(entry); if (i >= 0) PANELS.splice(i, 1);
    if (entry.el && entry.el.parentNode) entry.el.parentNode.removeChild(entry.el);
  }

  // anchor authored in units of modelRadius (R). +x screen-right, +y up, +z toward camera.
  function A(x, y, z){ return new THREE.Vector3(x, y, z).multiplyScalar(modelRadius); }

  // Pin to the ACTUAL brain mesh: shoot a ray from outside (along `dir`) toward the
  // centre and take the first surface hit, so the panel sits on the real geometry
  // (folds/bumps) in that direction — not on a smooth sphere. Falls back to a sphere
  // point if the ray misses. The hit is in world space and the brain is world-fixed,
  // so the panel stays welded to that exact point as the camera orbits.
  const _surfRay = new THREE.Raycaster();
  function surfaceAnchor(dir, lift = 0.05){
    const d = dir.clone().normalize();
    _surfRay.set(d.clone().multiplyScalar(modelRadius * 2.2), d.clone().negate());
    const hits = brainMesh ? _surfRay.intersectObject(brainMesh, false) : [];
    // The ray runs through the origin, so the hit lies on the `d` axis → its distance from
    // centre is the surface radius in this direction. Clamp to a minimum so a panel never
    // sinks into a recess/valley; it always rests on the brain's OUTER envelope like the rest.
    let radius = hits.length ? hits[0].point.length() : modelRadius * 0.45;
    radius = Math.max(radius, modelRadius * 0.42);
    return d.multiplyScalar(radius + modelRadius * lift);
  }

  function updatePanels() {
    if (!isBrainLoaded || !PANELS.length) return;
    const rect = displayCanvas.getBoundingClientRect();
    const camN = camera.position.clone().normalize();
    for (const p of PANELS) {
      _v.copy(p.anchor);
      const dist = _v.distanceTo(camera.position);
      _v.project(camera);
      const sx = rect.left + (_v.x * 0.5 + 0.5) * rect.width;
      const sy = rect.top  + (-_v.y * 0.5 + 0.5) * rect.height;
      // facing: 1 = anchor toward camera (front of the brain), -1 = away (behind it)
      const facing = p.anchor.clone().normalize().dot(camN);
      p._sx = sx; p._sy = sy; p._facing = facing;   // cached for the folder-link layer
      const depthScale = THREE.MathUtils.clamp(baseDistance / dist, 0.85, 1.12);
      p.el.style.left = sx + 'px';
      p.el.style.top  = sy + 'px';
      p.el.style.transform = `translate(-50%,-50%) scale(${(depthScale * p.scale * PANEL_SCALE).toFixed(3)})`;
      // OCCLUSION, not fade: a far-side panel drops BEHIND the opaque brain canvas
      // (z 5 < canvas 10) so the brain physically hides it; a near-side panel sits in
      // front (z 20). The panel itself stays flat, 2D and fully opaque the whole orbit.
      p.el.style.zIndex = facing >= 0 ? '20' : '5';
      const offEdge = Math.max(Math.abs(_v.x), Math.abs(_v.y));
      const onScreen = offEdge < 1.7 ? 1 : 0;          // frustum safety only — no orbit fade
      if (!p.skipOpacity) {
        p.opacity += (onScreen - p.opacity) * 0.3;
        p.el.style.opacity = p.opacity.toFixed(3);
      }
      p.el.style.pointerEvents = (facing > 0.05 && onScreen) ? 'auto' : 'none';
    }
    drawFolderLinks();
  }

  // ── FOLDER CONNECTIONS ──────────────────────────────────────────────
  // Thin glowing electric-blue lines drawn between the FOLDERS only (never the
  // data panels), with a small square node at each end — exactly like the ref.
  // Every folder connects to every other; a line only shows while BOTH of its
  // folders face the camera, fading out as either swings behind the brain.
  const linkSvg = document.getElementById('folderLinks');
  const SVGNS = 'http://www.w3.org/2000/svg';
  let folderEntries = [], linkEdges = [];
  function setupFolderLinks() {
    folderEntries = PANELS.filter(p => p.el.classList.contains('folder'));
    linkEdges = [];
    linkSvg.innerHTML = '';
    for (let i = 0; i < folderEntries.length; i++) {
      for (let j = i + 1; j < folderEntries.length; j++) {
        const ln = document.createElementNS(SVGNS, 'line');
        const r1 = document.createElementNS(SVGNS, 'rect');
        const r2 = document.createElementNS(SVGNS, 'rect');
        [r1, r2].forEach(r => { r.setAttribute('width', 7); r.setAttribute('height', 7); });
        linkSvg.append(ln, r1, r2);
        linkEdges.push({ a: folderEntries[i], b: folderEntries[j], ln, r1, r2 });
      }
    }
  }
  // pick the corner of rect nearest to point (tx,ty) → lines attach at folder corners
  function nearestCorner(rect, tx, ty) {
    const xs = (tx < rect.left + rect.width / 2) ? rect.left : rect.right;
    const ys = (ty < rect.top + rect.height / 2) ? rect.top : rect.bottom;
    return { x: xs, y: ys };
  }
  function frontness(f) { return THREE.MathUtils.clamp((f + 0.25) / 0.5, 0, 1); }
  function drawFolderLinks() {
    if (!linkEdges.length) return;
    for (const e of linkEdges) {
      const oa = frontness(e.a._facing), ob = frontness(e.b._facing);
      const vis = Math.min(oa, ob);
      if (vis <= 0.02 || e.a._sx == null || e.b._sx == null) {
        e.ln.style.display = e.r1.style.display = e.r2.style.display = 'none';
        continue;
      }
      const ra = e.a.el.querySelector('img').getBoundingClientRect();
      const rb = e.b.el.querySelector('img').getBoundingClientRect();
      const ca = nearestCorner(ra, e.b._sx, e.b._sy);
      const cb = nearestCorner(rb, e.a._sx, e.a._sy);
      e.ln.setAttribute('x1', ca.x); e.ln.setAttribute('y1', ca.y);
      e.ln.setAttribute('x2', cb.x); e.ln.setAttribute('y2', cb.y);
      e.r1.setAttribute('x', ca.x - 3.5); e.r1.setAttribute('y', ca.y - 3.5);
      e.r2.setAttribute('x', cb.x - 3.5); e.r2.setAttribute('y', cb.y - 3.5);
      e.ln.style.display = e.r1.style.display = e.r2.style.display = '';
      e.ln.style.opacity = e.r1.style.opacity = e.r2.style.opacity = vis.toFixed(2);
    }
  }

  // ── "IN MY BRAIN" live numbers ──────────────────────────────────────
  function animateMindPanel() {
    const cells = [...document.querySelectorAll('#mind .v')];
    cells.forEach(c => { c._cur = +c.dataset.base; });
    setInterval(() => {
      cells.forEach(c => {
        const base = +c.dataset.base, jit = +c.dataset.jit;
        const target = jit ? base + Math.round((Math.random() * 2 - 1) * jit)   // tasks running: jitter
                           : c._cur + Math.round(Math.random() * 6);           // to be started: tick up
        c._cur += (target - c._cur) * 0.5;
        c.textContent = Math.max(0, Math.round(c._cur));
      });
    }, 700);
  }

  // macOS "fan" view: clicking the folder makes its files rise UP out of it in a curved
  // fan. The files are CHILDREN of the folder element, so they emerge from inside it and
  // travel/scale/occlude together with the folder as the brain rotates.
  function makeFan(folderEl, files, isPage) {
    let open = false; const items = [];
    folderEl.addEventListener('click', () => { open = !open; open ? openFan() : closeFan(); });
    function openFan() {
      files.forEach((txt, k) => {
        const f = document.createElement('div');
        f.className = 'fanfile' + (isPage ? ' page' : '');
        f.innerHTML = `<span class="ic">${isPage ? '✎' : '▤'}</span>${txt}`;
        folderEl.appendChild(f); items.push(f);
        const ty = -(44 + k * 56);                 // each file higher than the last
        const tx = Math.sin(k * 0.7) * 22;          // gentle horizontal arc → fan shape
        const rot = Math.sin(k * 0.7) * 7;          // slight tilt per file
        requestAnimationFrame(() => requestAnimationFrame(() => {
          f.style.transitionDelay = (k * 45) + 'ms';   // pop out one after another
          f.style.transform = `translate(-50%, ${ty}px) translateX(${tx}px) rotate(${rot}deg) scale(1)`;
          f.classList.add('open');
        }));
      });
    }
    function closeFan() {
      items.forEach((f, k) => {
        f.style.transitionDelay = ((items.length - k) * 30) + 'ms';   // suck back in, top first
        f.classList.remove('open');
        f.style.transform = 'translate(-50%, 6px) scale(.3)';
        setTimeout(() => f.remove(), 700 + items.length * 30);
      });
      items.length = 0;
    }
  }

  /* ── build the kept manifestations ──
     8 manifestations evenly spaced (45° apart) around the brain: Podcast · GPU Monitor ·
     AI Leaderboard · Terminal · and 4 folders (2 on the right hemisphere, 2 on the left). */
  function setupPanels() {
    // Every panel is GLUED to a distinct region of the brain surface — distributed all
    // the way around it (frontal, temporal, parietal, occipital …) on a ring. The brain
    // is world-fixed and the camera orbits it, so each panel orbits WITH the brain:
    // the ones on the face turned toward you are visible, and as it rotates they swing to
    // the back and fade while others come round into view — exactly like thoughts stuck
    // to different lobes. Azimuths are 45° apart with ALTERNATING heights, so the handful
    // visible across the front are always staggered and never overlap each other.
    // Spread over the sphere: an UPPER band and a LOWER band, alternating around the ring
    // so neighbours are never at the same height (→ no overlap). Folders + data panels are
    // mixed across both bands (2 folders up, 2 down; 2 folders right, 2 left). surfaceAnchor
    // clamps recesses to the brain's outer envelope, so every panel sits on the EXTERIOR.
    const UP = 0.27, DN = -0.22;
    // make sure the mesh is in its resting tilt before we raycast surface points onto it
    brainModel.rotation.set(parseFloat(inputs.tiltX.value), parseFloat(inputs.tiltY.value), parseFloat(inputs.tiltZ.value));
    brainModel.updateMatrixWorld(true);
    // phiDeg: 0 = front, 45..135 = RIGHT flank, 180 = back, 225..315 = LEFT flank.
    // data panels are 25% bigger (scale 1.25); folders 50% bigger (scale 1.5)
    const PANEL = 1.25, FOLDER = 1.5;
    const place = (build, phiDeg, y, scale = PANEL) => {
      const p = phiDeg * Math.PI / 180;
      addAnchored(build, surfaceAnchor(new THREE.Vector3(Math.sin(p), y, Math.cos(p))), scale);
    };
    place(buildPodcast(),          0, UP);           // front — upper
    place(buildSideHustle(),      45, DN, FOLDER);   // RIGHT — folder (lower)
    place(buildClaudeMd(),        90, UP, FOLDER);   // RIGHT — folder (upper)
    place(buildTerminal(),       180, UP, 1.55);      // back — upper (enlarged)
    place(buildRandomThoughts(), 225, DN, FOLDER);   // LEFT — folder (lower)
    place(buildAiResources(),    270, UP, FOLDER);   // LEFT — folder (upper)
    place(buildModel(),          315, DN);           // LEFT — leaderboard (lower)
  }

  function mk(cls, html){ const d=document.createElement('div'); d.className='panel '+cls; d.innerHTML=html; panelsLayer.appendChild(d); return d; }

  /* ── FOLDERS (Figma glass icons) → files fan up out of the folder (macOS fan view) ── */
  function folder(img, label, files, isPage) {
    const d = mk('folder', `<img src="assets/${img}" alt="${label}" draggable="false"/>`);
    makeFan(d, files, isPage);
    return d;
  }
  const buildSideHustle    = () => folder('sideHustleFolder.png',     'Side Hustle Ideas',    ['AI Newsletter', 'Prompt Marketplace', 'Micro-SaaS app', 'Faceless YouTube'], false);
  const buildClaudeMd      = () => folder('claudeMdFolder.png',       'Claude.MD',            ['coding-rules.md', 'tone-of-voice.md', 'agent-system.md', 'context-window.md'], true);
  const buildRandomThoughts= () => folder('randomThoughtsFolder.png', 'Random Thoughts',      ['what if agents dream?', 'is taste the moat?', 'ship &gt; perfect', 'touch grass (maybe)'], false);
  const buildAiResources   = () => folder('aiResourcesFolder.png',    'AI Content Resources', ['best-prompts.pdf', 'model cheat-sheet', 'eval datasets', 'fine-tune guide'], true);

  /* ── TERMINAL — real streaming logs, chaotic on hover ── */
  function buildTerminal() {
    const d = mk('term-wrap term', `<div class="card term">
      <div class="bar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="name mono">agent — zsh</span></div>
      <div class="scr mono"></div></div>`);
    const scr = d.querySelector('.scr');
    const calm = [
      {t:'$ ./boot-agent --autonomous'}, {t:'booting agent…',c:'sys'},
      {t:'connecting models: claude · gpt · gemini',c:'sys'}, {t:'context window … 1,000,000 tokens',c:'sys'},
      {t:'> spinning up a startup idea'}, {t:'generating MVP scaffolding…',c:'sys'},
      {t:'writing 142 files',c:'sys'}, {t:'deploying to production…',c:'sys'},
      {t:'✓ launch successful — 0 humans involved',c:'ok'}, {t:'$ _'} ];
    const chaos = [ {t:'! agent spawned 3 sub-agents',c:'sys'}, {t:'! sub-agent spawned 9 sub-agents',c:'sys'},
      {t:'recursion depth … 47',c:'sys'}, {t:'rewriting own prompt…'}, {t:'optimizing the optimizer…',c:'sys'},
      {t:'✓ achieved sentience (temporary)',c:'ok'}, {t:'rolling back sentience…',c:'sys'} ];
    let queue=[...calm], typing=false, chaotic=false;
    function nextLine(){
      if (typing) return;
      if (!queue.length) queue=[...(chaotic?chaos:calm)];
      const item=queue.shift(); const ln=document.createElement('div'); ln.className='ln '+(item.c||'');
      scr.appendChild(ln); typing=true; let i=0;
      const cur=document.createElement('span'); cur.className='cursor'; const speed=chaotic?9:26;
      (function type(){ ln.textContent=item.t.slice(0,i++); ln.appendChild(cur); scr.scrollTop=scr.scrollHeight;
        if (i<=item.t.length) setTimeout(type, speed+Math.random()*speed);
        else { cur.remove(); typing=false; while (scr.children.length>11) scr.firstChild.remove(); } })();
    }
    setInterval(nextLine, 360);
    d.addEventListener('pointerenter',()=>{ chaotic=true; d.classList.add('term-on'); });
    d.addEventListener('pointerleave',()=>{ chaotic=false; d.classList.remove('term-on'); });
    return d;
  }

  /* ── AI LEADERBOARD (Figma) — macOS window, ranked rows, rankings reshuffle on hover ── */
  function buildModel() {
    const d = mk('board-wrap', `<div class="win board">
      <div class="tbar"><i></i><i></i><i></i></div>
      <div class="hd"><span class="gdot"></span><span class="t">AI Leaderboard</span></div>
      <div class="rows"></div></div>`);
    const rowsEl = d.querySelector('.rows');
    let models=[{n:'Claude',s:94.2},{n:'Gemini',s:92.7},{n:'ChatGPT',s:90.1},{n:'Grok',s:88.4},{n:'DeepSeek',s:86.9}];
    const map=new Map();
    models.forEach((m,i)=>{ const row=document.createElement('div'); row.className='row';
      row.innerHTML=`<span class="rk">#${i+1}</span><span class="nm">${m.n}</span><span class="sc"></span>`;
      rowsEl.appendChild(row); map.set(m.n,row); });
    function render(animate){
      const prev=new Map(); map.forEach((row,n)=>prev.set(n,row.getBoundingClientRect().top));
      models.sort((a,b)=>b.s-a.s);
      models.forEach((m,i)=>{ const row=map.get(m.n);
        row.querySelector('.rk').textContent='#'+(i+1); row.querySelector('.sc').textContent=m.s.toFixed(1);
        rowsEl.appendChild(row); });
      if (animate) map.forEach((row,n)=>{ const np=row.getBoundingClientRect().top, dd=prev.get(n)-np;
        if (dd){ row.style.transition='none'; row.style.transform=`translateY(${dd}px)`;
          requestAnimationFrame(()=>{ row.style.transition=''; row.style.transform=''; }); } });
    }
    render(false); let timer=null;
    function shuffle(){ models.forEach(m=>{ m.s=THREE.MathUtils.clamp(m.s+(Math.random()*3.2-1.6),80,99); }); render(true); }
    d.addEventListener('pointerenter',()=>{ shuffle(); timer=setInterval(shuffle,900); });
    d.addEventListener('pointerleave',()=>clearInterval(timer));
    return d;
  }

  /* ── PODCAST (Figma) — macOS window, blue cover + play, animated waveform ── */
  function buildPodcast() {
    const d = mk('pod-wrap', `<div class="win pod">
      <div class="tbar"><i></i><i></i><i></i></div>
      <div class="body">
        <div class="np"><span class="gdot"></span>Now Playing</div>
        <div class="grid">
          <div class="cover">
            <div class="ct">The Future Of<br>Everything In AI</div>
            <div class="arc"></div>
            <button class="play">▶</button>
            <div class="ca">Sam Altman</div>
          </div>
          <div class="right">
            <div class="h">The Future Of Everything In AI</div>
            <div class="a">Sam Altman</div>
            <div class="wave">${'<i></i>'.repeat(34)}</div>
            <div class="snip">“the future of AI is…”</div>
          </div>
        </div>
      </div></div>`);
    const bars=[...d.querySelectorAll('.wave i')]; const snipEl=d.querySelector('.snip'); const play=d.querySelector('.play');
    const snips=['“the future of AI is…”','“agents will replace…”','“reasoning models will…”','“compute is the new oil”','“AGI is closer than…”'];
    let on=false, t=0, beat=0;
    const N=bars.length, level=new Array(N).fill(0.15);
    const rate=bars.map(()=>0.05+Math.random()*0.15), phase=bars.map(()=>Math.random()*Math.PI*2);
    const weight=bars.map((_,i)=>{ const f=Math.abs(i-(N-1)/2)/((N-1)/2); return 0.5+0.5*(1-f); }); // centre-tall
    play.addEventListener('click',()=>{ on=!on; play.textContent=on?'❚❚':'▶'; });
    d.addEventListener('pointerenter',()=>{ on=true; play.textContent='❚❚'; });
    (function frame(){ requestAnimationFrame(frame); t+=1; beat*=0.85;
      if(on && Math.random()<0.07) beat=0.6+Math.random()*0.5;
      for(let i=0;i<N;i++){
        const target = on ? Math.min(1, weight[i]*(0.15+0.5*(0.5+0.5*Math.sin(t*rate[i]+phase[i]))) + Math.random()*0.25 + beat*0.2)
                          : 0.06+0.04*Math.random();
        const cur=level[i]; level[i]= target>cur ? cur+(target-cur)*0.6 : cur+(target-cur)*0.16;
        bars[i].style.height=(8+level[i]*92)+'%';
      }
    })();
    setInterval(()=>{ if(on){ snipEl.style.opacity=0; setTimeout(()=>{ snipEl.textContent=snips[(Math.random()*snips.length)|0]; snipEl.style.opacity=1; },300); } },2400);
    return d;
  }

  /* ── GPU MONITOR (Figma) — macOS window, big green usage + area chart ── */
  function buildGpu() {
    const d = mk('gpu-wrap', `<div class="win gpu">
      <div class="tbar"><i></i><i></i><i></i></div>
      <div class="hd"><span class="gdot"></span><span class="t">GPU Monitor</span></div>
      <div class="body">
        <div class="row"><span class="lbl">usage</span><span class="big">94.2</span></div>
        <canvas width="360" height="130"></canvas></div></div>`);
    const cv=d.querySelector('canvas'), g=cv.getContext('2d'), big=d.querySelector('.big');
    const N=64, data=new Array(N).fill(0.6);
    setInterval(()=>{
      let v=data[N-1]+(Math.random()*0.34-0.17); if(Math.random()<0.2) v=0.8+Math.random()*0.19;
      v=THREE.MathUtils.clamp(v,0.45,0.99); data.push(v); data.shift(); big.textContent=(v*100).toFixed(1);
      g.clearRect(0,0,cv.width,cv.height);
      const grad=g.createLinearGradient(0,0,0,cv.height); grad.addColorStop(0,'rgba(0,190,111,.55)'); grad.addColorStop(1,'rgba(0,190,111,0)');
      g.beginPath(); g.moveTo(0,cv.height);
      data.forEach((dv,i)=>{ g.lineTo(i/(N-1)*cv.width, cv.height-dv*cv.height); });
      g.lineTo(cv.width,cv.height); g.closePath(); g.fillStyle=grad; g.fill();
      g.beginPath(); data.forEach((dv,i)=>{ const x=i/(N-1)*cv.width,y=cv.height-dv*cv.height; i?g.lineTo(x,y):g.moveTo(x,y); });
      g.strokeStyle='#3dff9e'; g.lineWidth=2.5; g.stroke();
    },150);
    return d;
  }
