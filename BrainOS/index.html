    return d;
  };

  /* ── EASTER EGG: the hidden "Forbidden Vault" glass folder (Figma 2052:139) ── */
  function buildVault() {
    const d = mk('vault', `<div class="vault-folder">
      <div class="vf-glow"></div>
      <img class="vf-tab"  src="assets/vaultTab.svg"  alt="" draggable="false"/>
      <img class="vf-body" src="assets/vaultBody.svg" alt="" draggable="false"/>
      <div class="vf-title">Forbidden<br>Vault</div>
    </div>`);
    // clicking the vault itself must NOT dismiss the reveal (reserved for its future contents)
    d.addEventListener('click', e => e.stopPropagation());
    d.addEventListener('contextmenu', e => e.stopPropagation());
    return d;
  }

  /* ── TOKENS (Figma) — black usage-meter card: dot-matrix title + dotted spend bar + DETAILS pill ── */
  function buildTokens() {
    const COLS = 44, FILLED = 30;                 // 30 white (used) + 14 grey (headroom) — matches the design
    let bar = '';
    for (let i = 0; i < COLS; i++) {
      const off  = i >= FILLED ? ' off'  : '';
      const lead = i === FILLED - 1 ? ' lead' : '';   // last lit column pulses like a live cursor
      bar += `<div class="tcol${lead}"><div class="tdot${off}"></div><div class="tdot${off}"></div><div class="tdot${off}"></div></div>`;
    }
    return mk('tokens', `<div class="tcard">
      <div class="ttitle">TOKENS</div>
      <div class="trow"><span>SPENT : $1400</span><span>LIMIT : $500.00</span></div>
      <div class="tbar">${bar}</div>
      <div class="tfoot">
        <div class="twarn">You’re getting close to your limit consider slowing down spending</div>
        <div class="tbtn">DETAILS</div>
      </div></div>`);
  }

  /* ── TERMINAL — real streaming logs, chaotic on hover ── */
  function buildTerminal() {
    const d = mk('term-wrap term', `<div class="card term">
      <div class="bar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="name mono">agent — zsh</span></div>
      <div class="scr mono"></div></div>`);
    const scr = d.querySelector('.scr');
    const calm = [
      {t:'$ ./boot-agent --autonomous'}, {t:'booting agent…',c:'sys'},
      {t:'connecting models: claude · gpt · gemini',c:'sys'}, {t:'context window … 1,000,000 tokens',c:'sys'},
      {t:'> spinning up a startup idea'}, {t:'generating MVP scaffolding…',c:'sys'},
      {t:'writing 142 files',c:'sys'}, {t:'deploying to production…',c:'sys'},
      {t:'✓ launch successful — 0 humans involved',c:'ok'}, {t:'$ _'} ];
    const chaos = [ {t:'! agent spawned 3 sub-agents',c:'sys'}, {t:'! sub-agent spawned 9 sub-agents',c:'sys'},
      {t:'recursion depth … 47',c:'sys'}, {t:'rewriting own prompt…'}, {t:'optimizing the optimizer…',c:'sys'},
      {t:'✓ achieved sentience (temporary)',c:'ok'}, {t:'rolling back sentience…',c:'sys'} ];
    let queue=[...calm], typing=false, chaotic=false;
    function nextLine(){
      if (typing) return;
      if (!queue.length) queue=[...(chaotic?chaos:calm)];
      const item=queue.shift(); const ln=document.createElement('div'); ln.className='ln '+(item.c||'');
      scr.appendChild(ln); typing=true; let i=0;
      const cur=document.createElement('span'); cur.className='cursor'; const speed=chaotic?9:26;
      (function type(){ ln.textContent=item.t.slice(0,i++); ln.appendChild(cur); scr.scrollTop=scr.scrollHeight;
        if (i<=item.t.length) setTimeout(type, speed+Math.random()*speed);
        else { cur.remove(); typing=false; while (scr.children.length>11) scr.firstChild.remove(); } })();
    }
    setInterval(nextLine, 360);
    d.addEventListener('pointerenter',()=>{ chaotic=true; d.classList.add('term-on'); });
    d.addEventListener('pointerleave',()=>{ chaotic=false; d.classList.remove('term-on'); });
    return d;
  }

  /* ── AI LEADERBOARD (Figma) — macOS window, ranked rows, rankings reshuffle on hover ── */
  function buildModel() {
    const d = mk('board-wrap', `<div class="win board">
      <div class="tbar"><i></i><i></i><i></i></div>
      <div class="hd"><span class="gdot"></span><span class="t">AI Leaderboard</span></div>
      <div class="rows"></div></div>`);
    const rowsEl = d.querySelector('.rows');
    let models=[{n:'Claude',s:94.2},{n:'Gemini',s:92.7},{n:'ChatGPT',s:90.1},{n:'Grok',s:88.4},{n:'DeepSeek',s:86.9}];
    const map=new Map();
    models.forEach((m,i)=>{ const row=document.createElement('div'); row.className='row';
      row.innerHTML=`<span class="rk">#${i+1}</span><span class="nm">${m.n}</span><span class="sc"></span>`;
      rowsEl.appendChild(row); map.set(m.n,row); });
    function render(animate){
      const prev=new Map(); map.forEach((row,n)=>prev.set(n,row.getBoundingClientRect().top));
      models.sort((a,b)=>b.s-a.s);
      models.forEach((m,i)=>{ const row=map.get(m.n);
        row.querySelector('.rk').textContent='#'+(i+1); row.querySelector('.sc').textContent=m.s.toFixed(1);
        rowsEl.appendChild(row); });
      if (animate) map.forEach((row,n)=>{ const np=row.getBoundingClientRect().top, dd=prev.get(n)-np;
        if (dd){ row.style.transition='none'; row.style.transform=`translateY(${dd}px)`;
          requestAnimationFrame(()=>{ row.style.transition=''; row.style.transform=''; }); } });
    }
    render(false); let timer=null;
    function shuffle(){ models.forEach(m=>{ m.s=THREE.MathUtils.clamp(m.s+(Math.random()*3.2-1.6),80,99); }); render(true); }
    d.addEventListener('pointerenter',()=>{ shuffle(); timer=setInterval(shuffle,900); });
    d.addEventListener('pointerleave',()=>clearInterval(timer));
    return d;
  }

  /* ── PODCAST (Figma) — macOS window, blue cover + play, animated waveform ── */
  function buildPodcast() {
    const d = mk('pod-wrap', `<div class="win pod">
      <div class="tbar"><i></i><i></i><i></i></div>
      <div class="body">
        <div class="np"><span class="gdot"></span>Now Playing</div>
        <div class="grid">
          <div class="cover">
            <div class="ct">The Future Of<br>Everything In AI</div>
            <div class="arc"></div>
            <button class="play">▶</button>
            <div class="ca">Sam Altman</div>
          </div>
          <div class="right">
            <div class="h">The Future Of Everything In AI</div>
            <div class="a">Sam Altman</div>
            <div class="wave">${'<i></i>'.repeat(34)}</div>
            <div class="snip">“the future of AI is…”</div>
          </div>
        </div>
      </div></div>`);
    const bars=[...d.querySelectorAll('.wave i')]; const snipEl=d.querySelector('.snip'); const play=d.querySelector('.play');
    const snips=['“the future of AI is…”','“agents will replace…”','“reasoning models will…”','“compute is the new oil”','“AGI is closer than…”'];
    let on=false, t=0, beat=0;
    const N=bars.length, level=new Array(N).fill(0.15);
    const rate=bars.map(()=>0.05+Math.random()*0.15), phase=bars.map(()=>Math.random()*Math.PI*2);
    const weight=bars.map((_,i)=>{ const f=Math.abs(i-(N-1)/2)/((N-1)/2); return 0.5+0.5*(1-f); }); // centre-tall
    play.addEventListener('click',()=>{ on=!on; play.textContent=on?'❚❚':'▶'; });
    d.addEventListener('pointerenter',()=>{ on=true; play.textContent='❚❚'; });
    (function frame(){ requestAnimationFrame(frame); t+=1; beat*=0.85;
      if(on && Math.random()<0.07) beat=0.6+Math.random()*0.5;
      for(let i=0;i<N;i++){
        const target = on ? Math.min(1, weight[i]*(0.15+0.5*(0.5+0.5*Math.sin(t*rate[i]+phase[i]))) + Math.random()*0.25 + beat*0.2)
                          : 0.06+0.04*Math.random();
        const cur=level[i]; level[i]= target>cur ? cur+(target-cur)*0.6 : cur+(target-cur)*0.16;
        bars[i].style.height=(8+level[i]*92)+'%';
      }
    })();
    setInterval(()=>{ if(on){ snipEl.style.opacity=0; setTimeout(()=>{ snipEl.textContent=snips[(Math.random()*snips.length)|0]; snipEl.style.opacity=1; },300); } },2400);
    return d;
  }

  /* ── GPU MONITOR (Figma) — macOS window, big green usage + area chart ── */
  function buildGpu() {
    const d = mk('gpu-wrap', `<div class="win gpu">
      <div class="tbar"><i></i><i></i><i></i></div>
      <div class="hd"><span class="gdot"></span><span class="t">GPU Monitor</span></div>
      <div class="body">
        <div class="row"><span class="lbl">usage</span><span class="big">94.2</span></div>
        <canvas width="360" height="130"></canvas></div></div>`);
    const cv=d.querySelector('canvas'), g=cv.getContext('2d'), big=d.querySelector('.big');
    const N=64, data=new Array(N).fill(0.6);
    setInterval(()=>{
      let v=data[N-1]+(Math.random()*0.34-0.17); if(Math.random()<0.2) v=0.8+Math.random()*0.19;
      v=THREE.MathUtils.clamp(v,0.45,0.99); data.push(v); data.shift(); big.textContent=(v*100).toFixed(1);
      g.clearRect(0,0,cv.width,cv.height);
      const grad=g.createLinearGradient(0,0,0,cv.height); grad.addColorStop(0,'rgba(0,190,111,.55)'); grad.addColorStop(1,'rgba(0,190,111,0)');
      g.beginPath(); g.moveTo(0,cv.height);
      data.forEach((dv,i)=>{ g.lineTo(i/(N-1)*cv.width, cv.height-dv*cv.height); });
      g.lineTo(cv.width,cv.height); g.closePath(); g.fillStyle=grad; g.fill();
      g.beginPath(); data.forEach((dv,i)=>{ const x=i/(N-1)*cv.width,y=cv.height-dv*cv.height; i?g.lineTo(x,y):g.moveTo(x,y); });
      g.strokeStyle='#3dff9e'; g.lineWidth=2.5; g.stroke();
    },150);
    return d;
  }

  /* ════════════════════════════════════════════════════════════════════
     EASTER EGG WIRING — custom context menu + reveal / dismiss
     ════════════════════════════════════════════════════════════════════ */
  const ctxMenu = document.getElementById('ctxMenu');
  const ctxShowVault = document.getElementById('ctxShowVault');

  function showCtxMenu(x, y) {
    ctxMenu.classList.add('open'); ctxMenu.setAttribute('aria-hidden', 'false');
    const r = ctxMenu.getBoundingClientRect();                 // measure now that it's displayed
    ctxMenu.style.left = Math.max(6, Math.min(x, window.innerWidth  - r.width  - 6)) + 'px';
    ctxMenu.style.top  = Math.max(6, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
  }
  function hideCtxMenu() { ctxMenu.classList.remove('open'); ctxMenu.setAttribute('aria-hidden', 'true'); }

  function enterVault() {
    if (vaultState !== 'idle' || !isBrainLoaded) return;
    vaultState = 'entering';
    document.body.classList.add('vault-mode');     // fade the HUD chrome + folder-link lines
    vaultHidden = true;                            // fade the 8 panels out (driven in updatePanels)
    brainHold('vault');                            // ease the idle spin to a stop + lock drag
    vaultReturnAz = controls.getAzimuthalAngle();      // remember where to spin back to on dismiss
    vaultReturnPolar = controls.getPolarAngle();       // …and the vertical angle you were at
    setTimeout(() => {                             // …then turn to the side view and reveal the vault
      if (vaultState !== 'entering') return;
      vaultReveal = true;
      // ease from the CURRENT angle to the ABSOLUTE side-view azimuth (shortest path) + level polar,
      // so it lands the same every time and never snaps regardless of your starting angle.
      const cur = controls.getAzimuthalAngle();
      const goal = VAULT_VIEW_AZIMUTH_DEG * Math.PI / 180;
      startCamTurn(cur + normalizeAngle(goal - cur), 2.0, () => { vaultState = 'shown'; });
    }, 420);
  }
  function exitVault() {
    if (vaultState !== 'shown') return;
    vaultState = 'exiting';
    vaultReveal = false;                           // fade the vault out
    const cur = controls.getAzimuthalAngle();      // spin back to the original azimuth + vertical angle (shortest path)
    startCamTurn(cur + normalizeAngle(vaultReturnAz - cur), 2.0, () => {
      controls.autoRotate = true; controls.enableDamping = true;   // restore the live controls
      document.body.classList.remove('vault-mode'); // fade the HUD chrome back in
      vaultHidden = false;                           // fade the 8 panels back in
      brainRelease('vault');                         // resume idle spin + unlock drag
      vaultState = 'idle';
    }, vaultReturnPolar);                            // ease back to the vertical angle you were at
  }

  // Replace the native browser menu across the whole page.
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (vaultState !== 'idle') return;             // suppressed while the vault is busy / shown
    showCtxMenu(e.clientX, e.clientY);
  });
  ctxShowVault.addEventListener('click', (e) => { e.stopPropagation(); hideCtxMenu(); enterVault(); });

  // Click-away (capture phase): close the menu, or — when the vault is shown — exit the vault
  // for any click outside the vault folder itself.
  document.addEventListener('click', (e) => {
    if (ctxMenu.classList.contains('open') && !ctxMenu.contains(e.target)) hideCtxMenu();
    if (vaultState === 'shown' && !(vaultEntry && vaultEntry.el.contains(e.target))) exitVault();
    // CLICK-AWAY TO CLOSE A FOLDER: a click anywhere that isn't the open folder — its icon or
    // any of its opened panels — collapses it. Clicks on ANOTHER folder are left alone so that
    // folder's own logic can swap which one is open (the one-folder-at-a-time rule).
    if (_openFolderEl && !_openFolderEl.contains(e.target) &&
        !(e.target.closest && e.target.closest('.panel.folder'))) {
      const closeOpen = _folderClosers.get(_openFolderEl);
      if (closeOpen) closeOpen();
    }
  }, true);
  window.addEventListener('blur', hideCtxMenu);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (ctxMenu.classList.contains('open')) hideCtxMenu();
    else if (vaultState === 'shown') exitVault();
  });

</script>
