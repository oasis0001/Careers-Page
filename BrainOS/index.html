<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrainOS — Inside an AI Nerd's Mind</title>
<!--
  BrainOS. The ASCII brain core is pulled DIRECTLY from dither_brain.html
  (that file is left untouched): exact rendering, sizing, OrbitControls
  click-drag, hover detection, hemisphere tone-inversion highlight, camera feel.

  Manifestations (folders / terminal / model card / podcast / thought bubbles)
  are HTML elements anchored to fixed 3D points around the brain and re-projected
  to screen space every frame — so they are children of the brain: when you drag
  the brain (orbit the camera) every panel rotates, repositions, rescales and
  changes depth with it, fading away as it passes behind. No wires, no connectors.

  Run via a local server (GLB + ES modules need HTTP):
    python3 -m http.server 8000  →  http://localhost:8000/BrainOS/
-->
<style>
  :root{
    --text:#eef0f6; --muted:#7a7e8c; --muted-2:#4a4d59;
    --panel:#0c0d12; --panel-2:#101218; --border:#1c1d26; --border-hot:#2c3350;
    --blue:#6b9bff; --blue-soft:#8fb0ff; --green:#3dffa3;
    --ease-spring:cubic-bezier(.16,1.3,.3,1); --ease-soft:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#000;                      /* clean, deep black — no grid */
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,"Cascadia Code",monospace;}

  /* the reference control panel — kept (hidden) so the ported brain script runs verbatim */
  #controls{ display:none; }

  /* faint focus glow under the brain — the only "environment" element */
  #canvas-container{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(closest-side at 50% 50%, rgba(20,26,44,.55), rgba(0,0,0,0) 70%),
      #000;
  }
  #displayCanvas{
    image-rendering:pixelated;
    max-width:95%; max-height:95%;        /* EXACT sizing from dither_brain.html (intrinsic 1440×750) */
    cursor:grab; touch-action:none;
  }
  #displayCanvas:active{ cursor:grabbing; }

  /* ── anchored manifestations layer (projected onto the brain each frame) ── */
  #panels{ position:fixed; inset:0; z-index:5; pointer-events:none; }
  .panel{ position:absolute; left:0; top:0; opacity:0; will-change:transform,left,top,opacity;
          transform:translate(-50%,-50%); }

  /* solid cards — fully opaque so the brain never shows through them */
  .card{
    background:linear-gradient(180deg, #13151d, #0a0b10);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    box-shadow:0 16px 46px rgba(0,0,0,.7);
    position:relative; overflow:hidden; transition:border-color .4s, box-shadow .4s, background .4s;
  }
  .panel:hover .card{ border-color:var(--border-hot);
    background:linear-gradient(180deg, #1a1d27, #0d0f15);
    box-shadow:0 26px 74px rgba(0,0,0,.75), 0 0 0 1px rgba(107,155,255,.22), 0 0 40px rgba(107,155,255,.12); }
  .title{ font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--muted);
          display:flex; align-items:center; gap:7px; }
  .dot{ width:6px;height:6px;border-radius:50%; background:var(--muted-2); transition:background .3s, box-shadow .3s; }
  .panel:hover .dot{ background:var(--green); box-shadow:0 0 8px var(--green); }

  /* terminal */
  .term{ width:300px; }
  .term .bar{ display:flex; align-items:center; gap:6px; padding:8px 12px; background:#0c0e12; border-bottom:1px solid var(--border);}
  .term .tl{ width:11px;height:11px;border-radius:50%; }
  .term .tl.r{background:#ff5f56}.term .tl.y{background:#ffbd2e}.term .tl.g{background:#27c93f}
  .term .bar .name{ margin-left:8px; font-size:11px; color:var(--muted); }
  .term .scr{ height:176px; overflow:hidden; padding:10px 12px; font-size:12.5px; line-height:1.55;
              color:var(--green); background:radial-gradient(120% 100% at 0 0,#0a0e0c,#070908); }
  .term .scr .ln{ white-space:pre-wrap; word-break:break-word; }
  .term .scr .ln.sys{ color:#5b7d6e; } .term .scr .ln.ok{ color:#9dffce; }
  .term .scr .cursor{ display:inline-block; width:8px;height:14px; background:var(--green); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{50%{opacity:0}}
  .term-on .card{ box-shadow:0 0 0 1px rgba(61,255,163,.35), 0 0 50px rgba(61,255,163,.18), 0 26px 70px rgba(0,0,0,.6);}

  /* folders */
  .folder{ width:150px; text-align:center; cursor:pointer; user-select:none; }
  .folder img{ width:128px; display:block; margin:0 auto; filter:drop-shadow(0 16px 30px rgba(0,0,0,.6)); transition:transform .5s var(--ease-spring); }
  .folder:hover img{ transform:translateY(-6px) scale(1.05); }
  .folder .lbl{ margin-top:2px; font-size:11px; color:var(--muted); letter-spacing:1px; }

  /* model comparison */
  .board{ width:228px; padding:14px; }
  .board .rows{ margin-top:12px; position:relative; }
  .board .row{ display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:9px;
    background:#0e1016; border:1px solid var(--border); margin-bottom:6px;
    transition:transform .55s var(--ease-spring), background .3s, border-color .3s; }
  .board .row:last-child{margin-bottom:0;}
  .board .row .rk{ font-size:11px; color:var(--muted); width:14px; }
  .board .row .nm{ font-size:13px; font-weight:600; flex:1; }
  .board .row .sc{ font-size:12px; color:var(--blue-soft); font-variant-numeric:tabular-nums; }
  .board .row.lead{ border-color:var(--border-hot); background:#12151f; }
  .board .row.lead .sc{ color:var(--green); }

  /* podcast */
  .pod{ width:248px; padding:14px; }
  .pod .ep{ display:flex; align-items:center; gap:12px; margin-top:10px; }
  .pod .cover{ width:50px;height:50px;border-radius:11px; flex:none;
    background:conic-gradient(from 0deg,#6b9bff,#b58bff,#3dffa3,#6b9bff);
    display:flex;align-items:center;justify-content:center; font-size:20px;}
  .pod .meta .h{ font-size:13px; font-weight:700; }
  .pod .meta .s{ font-size:11px; color:var(--muted); }
  .pod .wave{ display:flex; align-items:flex-end; gap:2px; height:34px; margin-top:12px; }
  .pod .wave i{ flex:1; background:linear-gradient(180deg,var(--blue),#9b7bff); border-radius:2px; height:20%; transform-origin:bottom; }
  .pod .ctrl{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .pod .play{ width:34px;height:34px;border-radius:50%; border:none; cursor:pointer;
    background:var(--text); color:#000; font-size:13px; display:flex;align-items:center;justify-content:center;}
  .pod .snip{ font-size:11px; color:var(--blue-soft); min-height:14px; transition:opacity .3s; }

  /* compact "thought readout" panels (GPU / API / Gallery) — deliberately small + quiet */
  .mini{ width:170px; padding:12px; }
  .kv{ display:flex; justify-content:space-between; font-size:11.5px; margin:5px 0; }
  .kv .k{ color:var(--muted); } .kv .v{ color:var(--green); font-variant-numeric:tabular-nums; }
  .kv .v.blue{ color:var(--blue-soft); }
  .gpu .big{ font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .gpu canvas{ width:100%; height:50px; display:block; margin-top:8px; border-radius:6px; background:rgba(8,12,10,.5); }
  .gallery{ width:176px; padding:12px; }
  .frames{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:9px; }
  .frames .fr{ aspect-ratio:1; border-radius:8px; border:1px solid rgba(255,255,255,.06); overflow:hidden; }
  .frames .fr div{ width:100%;height:100%; background-size:200% 200%; animation:artshift 9s linear infinite; }
  .gallery.on .frames .fr div{ animation-duration:2.2s; }
  @keyframes artshift{0%{background-position:0 0;filter:hue-rotate(0)}100%{background-position:200% 200%;filter:hue-rotate(360deg)}}

  /* idea cards / book pages (transient anchored bits) */
  .idea{ background:linear-gradient(180deg,#12141c,#0c0d12); border:1px solid var(--border-hot);
    color:var(--text); font-size:12px; font-weight:600; padding:9px 13px; border-radius:10px;
    white-space:nowrap; box-shadow:0 16px 40px rgba(0,0,0,.6), 0 0 22px rgba(107,155,255,.18); }
  .idea .ic{ color:var(--blue); margin-right:6px; }
  .page{ width:150px; background:#f3f3f0; color:#1b1b1b; border-radius:6px; padding:10px 12px;
    font-size:11px; line-height:1.4; box-shadow:0 14px 32px rgba(0,0,0,.6); }
  .page b{ color:#6b3bff; }

  /* thought bubbles — the textbox aesthetic */
  .bubble{ max-width:260px; font-weight:600; font-size:14px; line-height:1.25; color:#16161a;
    padding:13px 20px; border-radius:30px;
    background:linear-gradient(180deg,#f4f4f6,#dcdce1);
    box-shadow:0 16px 36px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7); }
  .bubble.s2{ background:linear-gradient(180deg,#eef0f4,#cfd3db); }
  .bubble::before,.bubble::after{ content:""; position:absolute; left:18px; border-radius:50%;
    background:inherit; box-shadow:inset 0 1px 0 rgba(255,255,255,.6); }
  .bubble::before{ width:13px;height:13px; bottom:-12px; }
  .bubble::after{ width:7px;height:7px; bottom:-22px; left:12px; }

  /* minimal HUD */
  .hud{ position:fixed; z-index:40; font-size:11px; letter-spacing:.5px; opacity:.85; }
  #brand{ top:24px; right:28px; text-align:right; }
  #brand .b{ font-size:15px; font-weight:700; }
  #brand .b .ld{ display:inline-block; width:7px;height:7px;border-radius:50%; background:var(--green);
    margin-right:6px; box-shadow:0 0 8px var(--green); vertical-align:1px; animation:pulse 1.7s infinite; }
  #brand .s{ color:var(--muted); font-size:10px; letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  #hint{ bottom:22px; left:50%; transform:translateX(-50%); color:var(--muted-2); letter-spacing:1px; text-align:center; }

  #status{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:70;
    background:rgba(8,9,13,.85); border:1px solid var(--border); color:var(--muted);
    padding:14px 20px; border-radius:12px; font-size:13px; text-align:center; max-width:460px; pointer-events:none; }
  #status code{ background:#1a1c24; color:#ffd97a; padding:2px 6px; border-radius:4px; font-size:12px; }
  #status.error{ border-color:#5a2b2b; color:#ff9a8a; }
  #status.ok{ display:none; }
</style>
</head>
<body>

<!-- Reference control panel: hidden, present only so the ported brain script reads inputs exactly as in dither_brain.html -->
<div id="controls">
  <select id="charset"><option value="minimal" selected>minimal</option></select>
  <input type="color" id="tintColor" value="#C8C8C8">
  <input type="range" id="tones" value="2">
  <input type="range" id="highlight" value="1.0">
  <input type="range" id="resolution" value="9">
  <input type="range" id="contrast" value="2.3">
  <input type="range" id="threshold" value="1.7">
  <input type="range" id="shadowLift" value="28">
  <input type="range" id="noise" value="47">
  <input type="range" id="fps" value="36">
  <input type="range" id="rotY" value="0.42">
  <input type="range" id="rotX" value="0">
  <input type="range" id="rotZ" value="0">
  <input type="range" id="tiltX" value="0">
  <input type="range" id="tiltY" value="-1.2">
  <input type="range" id="tiltZ" value="0">
  <input type="range" id="zoom" value="1.0">
  <input type="color" id="modelColor" value="#cfcfcf">
  <input type="range" id="lightIntensity" value="6">
</div>

<div id="canvas-container">
  <canvas id="displayCanvas"></canvas>
</div>

<div id="panels"></div>

<div id="brand" class="hud">
  <div class="b"><span class="ld"></span>BrainOS</div>
  <div class="s">a mind that won't stop building</div>
</div>
<div id="hint" class="hud">drag to rotate the mind · hover a hemisphere · click the folders</div>

<div id="status">Initializing consciousness…</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  /* ════════════════════════════════════════════════════════════════════
     BRAIN CORE — ported directly from dither_brain.html (unchanged behaviour)
     ════════════════════════════════════════════════════════════════════ */
  const AUTO_ROTATE_SPEED  = 1.5;
  const VERTICAL_LIMIT_DEG = 25;
  const DRAG_SENSITIVITY   = 1.0;

  const DEBUG_REGIONS = false;
  const REGION = { splitAxis: 'x', splitSign: 1, splitAt: 0.5 };
  const HIGHLIGHT = { fadeSpeed: 9.0, tintBlend: 0.0 };
  const REGION_DEBUG_COLORS = ['#ff5555', '#5599ff'];
  const REGION_LEFT = 0, REGION_RIGHT = 1;

  const displayCanvas = document.getElementById('displayCanvas');
  const ctx = displayCanvas.getContext('2d', { alpha: false });
  const statusEl = document.getElementById('status');
  function setStatus(msg, kind = '') { statusEl.innerHTML = msg; statusEl.className = kind; }

  const isFileProtocol = location.protocol === 'file:';
  if (isFileProtocol) {
    setStatus('Open this page via a local server, not <code>file://</code>.<br>' +
      'Run <code>python3 -m http.server 8000</code>, then open <code>http://localhost:8000/BrainOS/</code>.', 'error');
  } else { setStatus('Loading 3D model…'); }

  const offscreenCanvas = document.createElement('canvas');
  const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });

  const charSets = {
    ascii:   "Ñ@#W$9876543210?!abc;:+=-,._ ",
    blocks:  "█▓▒░ ", binary: "10 ", minimal: "#*+-. "
  };

  const inputs = {
    resolution: el('resolution'), noise: el('noise'), fps: el('fps'), threshold: el('threshold'),
    contrast: el('contrast'), shadowLift: el('shadowLift'), tones: el('tones'), highlight: el('highlight'),
    charset: el('charset'), tintColor: el('tintColor'), rotY: el('rotY'), rotX: el('rotX'), rotZ: el('rotZ'),
    tiltX: el('tiltX'), tiltY: el('tiltY'), tiltZ: el('tiltZ'), zoom: el('zoom'),
    modelColor: el('modelColor'), lightIntensity: el('lightIntensity'),
  };
  function el(id){ return document.getElementById(id); }

  const threeCanvas = document.createElement('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 3);

  RectAreaLightUniformsLib.init();
  const areaLight = new THREE.RectAreaLight(0xffffff, 6, 6, 6);
  areaLight.position.set(6, 1, -4); areaLight.lookAt(0, 0, 0); scene.add(areaLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.45);
  fillLight.position.set(-5, 1.5, 2); scene.add(fillLight); scene.add(fillLight.target);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x0a0a10, 0.2));

  const keyLightOffset = new THREE.Vector3(), fillLightOffset = new THREE.Vector3();
  function updateLightRig() {
    camera.updateMatrixWorld();
    areaLight.position.copy(keyLightOffset).applyMatrix4(camera.matrixWorld); areaLight.lookAt(0, 0, 0);
    fillLight.position.copy(fillLightOffset).applyMatrix4(camera.matrixWorld);
  }

  const brainGroup = new THREE.Group(); scene.add(brainGroup);

  const controls = new OrbitControls(camera, displayCanvas);
  controls.target.set(0, 0, 0);
  controls.enablePan = false; controls.enableZoom = false;
  controls.enableDamping = true; controls.dampingFactor = 0.045;
  controls.rotateSpeed = DRAG_SENSITIVITY * 0.7;
  // Auto-rotate OFF so the attached panels rest in a stable, non-overlapping
  // composition on the brain's face. Drag still orbits the brain + panels together.
  controls.autoRotate = false; controls.autoRotateSpeed = AUTO_ROTATE_SPEED;
  const polarHalfRange = THREE.MathUtils.degToRad(VERTICAL_LIMIT_DEG);
  controls.minPolarAngle = Math.PI / 2 - polarHalfRange;
  controls.maxPolarAngle = Math.PI / 2 + polarHalfRange;

  function setNdcFromEvent(e) {
    const rect = displayCanvas.getBoundingClientRect();
    ndc.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
    ndc.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  }
  displayCanvas.addEventListener('pointermove', (e) => {
    pointerInside = true; if (e.buttons !== 0) return; setNdcFromEvent(e);
  });
  displayCanvas.addEventListener('pointerleave', () => { pointerInside = false; hoveredRegion = -1; });

  function doPick() {
    if (!isBrainLoaded || !brainMesh || !pointerInside) { hoveredRegion = -1; return; }
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObject(brainMesh, false);
    if (!hits.length || !hits[0].face) { hoveredRegion = -1; return; }
    const ra = brainGeometry.getAttribute('region'); const f = hits[0].face;
    const a = Math.round(ra.getX(f.a)), b = Math.round(ra.getX(f.b)), c = Math.round(ra.getX(f.c));
    hoveredRegion = (a === c) ? a : (b === c ? b : a);
  }

  let brainModel = null, baseDistance = 3, isBrainLoaded = false;
  let currentModelColor = inputs.modelColor.value;
  let brainMesh = null, brainGeometry = null, brainMaterial = null;
  let modelRadius = 1;                     // max dimension — used to scale panel anchors
  const raycaster = new THREE.Raycaster(); const ndc = new THREE.Vector2();
  let hoveredRegion = -1, pointerInside = false, highlightMix = 0, maskPixels = null;

  function classifyRegions(geometry) {
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox, min = bb.min, size = new THREE.Vector3().subVectors(bb.max, bb.min);
    const pos = geometry.getAttribute('position'), n = pos.count;
    const region = new Float32Array(n);
    const colors = DEBUG_REGIONS ? new Float32Array(n * 3) : null;
    const dbg = DEBUG_REGIONS ? REGION_DEBUG_COLORS.map(h => new THREE.Color(h)) : null;
    const axis = REGION.splitAxis;
    const get = axis === 'x' ? 'getX' : axis === 'y' ? 'getY' : 'getZ';
    const s = axis === 'x' ? size.x : axis === 'y' ? size.y : size.z;
    const m = axis === 'x' ? min.x : axis === 'y' ? min.y : min.z;
    for (let i = 0; i < n; i++) {
      let t = s ? (pos[get](i) - m) / s : 0.5;
      if (REGION.splitSign < 0) t = 1 - t;
      const id = t < REGION.splitAt ? REGION_LEFT : REGION_RIGHT;
      region[i] = id;
      if (colors) { const c = dbg[id]; colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b; }
    }
    geometry.setAttribute('region', new THREE.BufferAttribute(region, 1));
    if (colors) geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  }

  const maskMaterial = new THREE.ShaderMaterial({
    uniforms: { uHoveredRegion: { value: -1.0 } },
    vertexShader: `attribute float region; varying float vRegion;
      void main(){ vRegion=region; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying float vRegion; uniform float uHoveredRegion;
      void main(){ float isHot=step(abs(vRegion-uHoveredRegion),0.5); gl_FragColor=vec4(vec3(isHot),1.0); }`,
  });

  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
  dracoLoader.setDecoderConfig({ type: 'js' });
  const gltfLoader = new GLTFLoader(); gltfLoader.setDRACOLoader(dracoLoader);

  gltfLoader.load('Brain.glb', (gltf) => {
    brainModel = gltf.scene;
    brainModel.traverse(node => {
      if (node.isMesh) {
        const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(currentModelColor), roughness: 0.78, metalness: 0.0 });
        if (DEBUG_REGIONS) mat.vertexColors = true;
        node.material = mat; brainMesh = node; brainGeometry = node.geometry; brainMaterial = mat;
      }
    });
    const box = new THREE.Box3().setFromObject(brainModel);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    brainModel.position.sub(center);
    if (brainGeometry) classifyRegions(brainGeometry);
    const maxDim = Math.max(size.x, size.y, size.z); modelRadius = maxDim;
    const fovRad = (camera.fov * Math.PI) / 180;
    baseDistance = (maxDim / (2 * Math.tan(fovRad / 2)));
    brainGroup.add(brainModel);
    camera.position.set(0, 0, baseDistance * parseFloat(inputs.zoom.value));
    controls.update();
    camera.updateMatrixWorld();
    keyLightOffset.copy(areaLight.position).applyMatrix4(camera.matrixWorld.clone().invert());
    fillLightOffset.copy(fillLight.position).applyMatrix4(camera.matrixWorld.clone().invert());
    isBrainLoaded = true; setStatus('', 'ok');
    setupPanels();                          // build the anchored manifestations now that we know modelRadius
  },
  (xhr) => { if (isFileProtocol) return; if (xhr.lengthComputable) setStatus(`Loading 3D model… ${Math.round((xhr.loaded/xhr.total)*100)}%`); },
  (err) => { console.error('Failed to load Brain.glb:', err); if (isFileProtocol) return;
    setStatus('Failed to load <code>Brain.glb</code>. Check the console for details.', 'error'); });

  const W = 1440, H = 750;
  displayCanvas.width = W; displayCanvas.height = H;
  offscreenCanvas.width = W; offscreenCanvas.height = H;
  maskCanvas.width = W; maskCanvas.height = H;
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : { r: 255, g: 255, b: 255 };
  }

  let lastDrawTime = performance.now(), lastFrameTime = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - lastFrameTime) / 1000); lastFrameTime = now;

    if (isBrainLoaded) {
      brainModel.rotation.set(parseFloat(inputs.tiltX.value), parseFloat(inputs.tiltY.value), parseFloat(inputs.tiltZ.value));
      controls.update(dt);
      updateLightRig();
      updatePanels();                       // ← project the attached manifestations every frame
      doPick();
      const want = (hoveredRegion >= 0 && !DEBUG_REGIONS) ? 1 : 0;
      highlightMix = THREE.MathUtils.damp(highlightMix, want, HIGHLIGHT.fadeSpeed, dt);
      renderer.render(scene, camera);
    }

    const fps = parseInt(inputs.fps.value);
    if (now - lastDrawTime < 1000 / fps) return;
    lastDrawTime = now;

    offCtx.clearRect(0, 0, W, H);
    if (isBrainLoaded) offCtx.drawImage(threeCanvas, 0, 0, W, H);

    maskPixels = null;
    if (isBrainLoaded && hoveredRegion >= 0 && highlightMix > 0.004) {
      maskMaterial.uniforms.uHoveredRegion.value = hoveredRegion;
      scene.overrideMaterial = maskMaterial; renderer.render(scene, camera); scene.overrideMaterial = null;
      maskCtx.clearRect(0, 0, W, H); maskCtx.drawImage(threeCanvas, 0, 0, W, H);
      maskPixels = maskCtx.getImageData(0, 0, W, H).data;
    }
    drawDither();
  }

  function drawDither() {
    const res = parseInt(inputs.resolution.value);
    const noiseLvl = parseInt(inputs.noise.value);
    const thresh = parseFloat(inputs.threshold.value);
    const contrast = parseFloat(inputs.contrast.value);
    const shadowLift = parseInt(inputs.shadowLift.value);
    const tones = parseInt(inputs.tones.value);
    const highlight = parseFloat(inputs.highlight.value);
    const tint = hexToRgb(inputs.tintColor.value);
    const mode = inputs.charset.value === 'halftone' ? 'halftone' : 'ascii';
    const density = charSets[inputs.charset.value] || charSets.minimal;

    ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, W, H);
    ctx.font = `bold ${res}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (!isBrainLoaded) return;

    const pixels = offCtx.getImageData(0, 0, W, H).data;
    for (let y = 0; y < H; y += res) {
      for (let x = 0; x < W; x += res) {
        const index = (y * W + x) * 4;
        const r = pixels[index], g = pixels[index+1], b = pixels[index+2], a = pixels[index+3];
        if (a < 128) continue;
        const srcLum = r * 0.299 + g * 0.587 + b * 0.114;
        let brightness = srcLum;
        brightness = ((brightness / 255 - 0.5) * contrast + 0.5) * 255;
        brightness = brightness + shadowLift * (1 - Math.max(0, Math.min(255, brightness)) / 255);
        const noise = (Math.random() - 0.5) * noiseLvl;
        brightness = (brightness * thresh) + noise;
        brightness = Math.max(0, Math.min(255, brightness));
        if (brightness < 10) continue;
        let bUse = brightness;
        if (maskPixels && maskPixels[index] > 128) bUse = brightness + (255 - 2 * brightness) * highlightMix;
        const lvl = Math.min(tones - 1, Math.floor((bUse / 255) * tones));
        const intensity = (lvl === tones - 1) ? highlight : (lvl + 1) / tones;
        let cr, cg, cb;
        const chroma = Math.max(r, g, b) - Math.min(r, g, b);
        if (chroma < 18) { cr = tint.r * intensity; cg = tint.g * intensity; cb = tint.b * intensity; }
        else {
          const norm = srcLum > 0 ? intensity / (srcLum / 255) : intensity;
          cr = r * norm; cg = g * norm; cb = b * norm;
          const tb = HIGHLIGHT.tintBlend;
          if (tb > 0) { cr = cr*(1-tb)+tint.r*intensity*tb; cg = cg*(1-tb)+tint.g*intensity*tb; cb = cb*(1-tb)+tint.b*intensity*tb; }
        }
        const col = `rgb(${Math.min(255,cr)|0}, ${Math.min(255,cg)|0}, ${Math.min(255,cb)|0})`;
        const cx = x + res/2, cy = y + res/2;
        if (mode === 'halftone') {
          ctx.lineWidth = Math.max(0.5, intensity * res * 0.2); ctx.strokeStyle = col;
          ctx.beginPath(); ctx.arc(cx, cy, res * 0.42, 0, Math.PI * 2); ctx.stroke();
        } else {
          const charIndex = Math.floor((1 - intensity) * (density.length - 1));
          ctx.fillStyle = col; ctx.fillText(density[charIndex], cx, cy);
        }
      }
    }
  }
  requestAnimationFrame(loop);

  /* ════════════════════════════════════════════════════════════════════
     ANCHORED MANIFESTATIONS — HTML children of the brain
     Each entry has a fixed 3D anchor (in brain-centred world space). The brain
     is world-fixed and the CAMERA orbits it (OrbitControls), so re-projecting
     these anchors every frame makes the panels move/scale/depth-sort/fade WITH
     the brain exactly as if they were welded to its surface. No wires.
     ════════════════════════════════════════════════════════════════════ */
  const panelsLayer = document.getElementById('panels');
  const PANELS = [];                  // {el, anchor:Vector3, scale, opacity, hover}
  const _v = new THREE.Vector3();
  const PANEL_SCALE = 0.82;           // keep the brain the hero (≈70/30) — panels are secondary
  const IDLE_OPACITY = 0.7;           // quiet until you engage them; hover lifts to full

  function addAnchored(elm, anchorVec, scale = 1) {
    const entry = { el: elm, anchor: anchorVec, scale, opacity: 0, hover: false };
    elm.addEventListener('pointerenter', () => entry.hover = true);
    elm.addEventListener('pointerleave', () => entry.hover = false);
    PANELS.push(entry); return entry;
  }
  function removeAnchored(entry) {
    const i = PANELS.indexOf(entry); if (i >= 0) PANELS.splice(i, 1);
    if (entry.el && entry.el.parentNode) entry.el.parentNode.removeChild(entry.el);
  }

  // anchor authored in units of modelRadius (R). +x screen-right, +y up, +z toward camera.
  function A(x, y, z){ return new THREE.Vector3(x, y, z).multiplyScalar(modelRadius); }

  function updatePanels() {
    if (!isBrainLoaded || !PANELS.length) return;
    const rect = displayCanvas.getBoundingClientRect();
    const camN = camera.position.clone().normalize();
    for (const p of PANELS) {
      _v.copy(p.anchor);
      const dist = _v.distanceTo(camera.position);
      _v.project(camera);
      const sx = rect.left + (_v.x * 0.5 + 0.5) * rect.width;
      const sy = rect.top  + (-_v.y * 0.5 + 0.5) * rect.height;
      // facing: is the anchor on the camera-facing side of the brain? 1 = front, -1 = back.
      // Panels glide across the FRONT surface of the brain (overlapping it, as if stuck
      // to it) and only fade out once they orbit around to the BACK.
      const facing = p.anchor.clone().normalize().dot(camN);
      const behind = THREE.MathUtils.clamp((facing + 0.35) / 0.30, 0, 1);     // fade over the back
      const offEdge = Math.max(Math.abs(_v.x), Math.abs(_v.y));               // NDC distance from centre
      const inView = THREE.MathUtils.clamp((1.45 - offEdge) / 0.25, 0, 1);    // safety: never fling off-frustum
      const vis = behind * inView;
      const targetOp = vis * (p.hover ? 1.0 : IDLE_OPACITY);                  // quiet until engaged
      p.opacity += (targetOp - p.opacity) * 0.18;
      const depthScale = THREE.MathUtils.clamp(baseDistance / dist, 0.8, 1.12);
      p.el.style.left = sx + 'px';
      p.el.style.top  = sy + 'px';
      p.el.style.transform = `translate(-50%,-50%) scale(${(depthScale * p.scale * PANEL_SCALE).toFixed(3)})`;
      p.el.style.opacity = p.opacity.toFixed(3);
      p.el.style.zIndex = String(20 + Math.round(facing * 12));
      p.el.style.pointerEvents = (vis > 0.5) ? 'auto' : 'none';
    }
  }

  /* ── build the kept manifestations ──
     LEFT  (logic / builder):  Learn → Compare → Optimize → Build
        AI Ideas (upper-left) · AI Leaderboard (mid-left) · API Cost (upper-left REAR)
        GPU Monitor (upper-left) · Terminal (lower-left)
     RIGHT (creative / dreamer): Listen → Imagine → Create → Reflect
        Podcast (upper-right) · AI Art Gallery (mid-right) · Prompt Book (lower-right)
        Thought Bubbles (floating, right side) */
  function setupPanels() {
    // Anchors sit on the brain's surface rim — small |y| / |z| so they hug the brain
    // and glide across its front face as it rotates, never flinging off the frustum.
    // LEFT hemisphere
    addAnchored(buildIdeas(),    A(-0.56,  0.20,  0.12), 0.96);   // upper-left
    addAnchored(buildGpu(),      A(-0.66,  0.04,  0.02), 0.92);   // upper-left
    addAnchored(buildModel(),    A(-0.58, -0.12,  0.14), 0.96);   // mid-left
    addAnchored(buildApiCost(),  A(-0.42,  0.18, -0.34), 0.90);   // upper-left, REAR (discovered on rotate)
    addAnchored(buildTerminal(), A(-0.56, -0.20,  0.10), 1.0);    // lower-left
    // RIGHT hemisphere
    addAnchored(buildPodcast(),  A( 0.56,  0.20,  0.12), 1.0);    // upper-right
    addAnchored(buildGallery(),  A( 0.66, -0.04,  0.06), 0.94);   // mid-right
    addAnchored(buildBook(),     A( 0.54, -0.18,  0.12), 1.0);    // lower-right
    // ambient thought bubbles drift around the right side
    startThoughtBubbles();
  }

  function mk(cls, html){ const d=document.createElement('div'); d.className='panel '+cls; d.innerHTML=html; panelsLayer.appendChild(d); return d; }

  /* ── AI IDEAS FOLDER → explodes into idea cards ── */
  function buildIdeas() {
    const d = mk('folder', `<img src="assets/aiIdeasFolder.png" alt="AI Ideas" draggable="false"/><div class="lbl">AI Ideas</div>`);
    let open = false; let cards = [];
    const list = ['Uber For AI Agents','AI Co-Founder Simulator','Prompt Marketplace','GitHub For Prompts','AI Product Generator','Autonomous Startup Builder'];
    d.addEventListener('click', () => { open = !open; open ? explode() : collapse(); });
    function explode() {
      const base = ideasEntry().anchor;
      list.forEach((txt, k) => {
        const c = mk('idea', `<span class="ic">◇</span>${txt}`); c.style.transition = 'opacity .4s';
        const spreadY = (k - (list.length - 1) / 2) * 0.07 * modelRadius;
        const anchor = base.clone().add(new THREE.Vector3((-0.12 - k * 0.05) * modelRadius, spreadY, 0.06 * modelRadius));
        cards.push(addAnchored(c, anchor, 0.9));
      });
    }
    function collapse() { cards.forEach(removeAnchored); cards = []; }
    let _self; const ideasEntry = () => (_self ||= PANELS.find(p => p.el === d));
    return d;
  }

  /* ── TERMINAL — real streaming logs, chaotic on hover ── */
  function buildTerminal() {
    const d = mk('term-wrap term', `<div class="card term">
      <div class="bar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="name mono">agent — zsh</span></div>
      <div class="scr mono"></div></div>`);
    const scr = d.querySelector('.scr');
    const calm = [
      {t:'$ ./boot-agent --autonomous'}, {t:'booting agent…',c:'sys'},
      {t:'connecting models: claude · gpt · gemini',c:'sys'}, {t:'context window … 1,000,000 tokens',c:'sys'},
      {t:'> spinning up a startup idea'}, {t:'generating MVP scaffolding…',c:'sys'},
      {t:'writing 142 files',c:'sys'}, {t:'deploying to production…',c:'sys'},
      {t:'✓ launch successful — 0 humans involved',c:'ok'}, {t:'$ _'} ];
    const chaos = [ {t:'! agent spawned 3 sub-agents',c:'sys'}, {t:'! sub-agent spawned 9 sub-agents',c:'sys'},
      {t:'recursion depth … 47',c:'sys'}, {t:'rewriting own prompt…'}, {t:'optimizing the optimizer…',c:'sys'},
      {t:'✓ achieved sentience (temporary)',c:'ok'}, {t:'rolling back sentience…',c:'sys'} ];
    let queue=[...calm], typing=false, chaotic=false;
    function nextLine(){
      if (typing) return;
      if (!queue.length) queue=[...(chaotic?chaos:calm)];
      const item=queue.shift(); const ln=document.createElement('div'); ln.className='ln '+(item.c||'');
      scr.appendChild(ln); typing=true; let i=0;
      const cur=document.createElement('span'); cur.className='cursor'; const speed=chaotic?9:26;
      (function type(){ ln.textContent=item.t.slice(0,i++); ln.appendChild(cur); scr.scrollTop=scr.scrollHeight;
        if (i<=item.t.length) setTimeout(type, speed+Math.random()*speed);
        else { cur.remove(); typing=false; while (scr.children.length>11) scr.firstChild.remove(); } })();
    }
    setInterval(nextLine, 360);
    d.addEventListener('pointerenter',()=>{ chaotic=true; d.classList.add('term-on'); });
    d.addEventListener('pointerleave',()=>{ chaotic=false; d.classList.remove('term-on'); });
    return d;
  }

  /* ── MODEL COMPARISON — rankings reshuffle on hover ── */
  function buildModel() {
    const d = mk('board-wrap', `<div class="card board"><div class="title"><span class="dot"></span>AI Leaderboard</div><div class="rows"></div></div>`);
    const rowsEl = d.querySelector('.rows');
    let models=[{n:'Claude',s:94.2},{n:'GPT',s:92.7},{n:'Gemini',s:90.1},{n:'Grok',s:88.4},{n:'DeepSeek',s:86.9}];
    const map=new Map();
    models.forEach(m=>{ const row=document.createElement('div'); row.className='row';
      row.innerHTML=`<span class="rk mono"></span><span class="nm">${m.n}</span><span class="sc mono"></span>`;
      rowsEl.appendChild(row); map.set(m.n,row); });
    function render(animate){
      const prev=new Map(); map.forEach((row,n)=>prev.set(n,row.getBoundingClientRect().top));
      models.sort((a,b)=>b.s-a.s);
      models.forEach((m,i)=>{ const row=map.get(m.n);
        row.querySelector('.rk').textContent='#'+(i+1); row.querySelector('.sc').textContent=m.s.toFixed(1);
        row.classList.toggle('lead', i===0); rowsEl.appendChild(row); });
      if (animate) map.forEach((row,n)=>{ const np=row.getBoundingClientRect().top, dd=prev.get(n)-np;
        if (dd){ row.style.transition='none'; row.style.transform=`translateY(${dd}px)`;
          requestAnimationFrame(()=>{ row.style.transition=''; row.style.transform=''; }); } });
    }
    render(false); let timer=null;
    function shuffle(){ models.forEach(m=>{ m.s=THREE.MathUtils.clamp(m.s+(Math.random()*3.2-1.6),80,99); }); render(true); }
    d.addEventListener('pointerenter',()=>{ shuffle(); timer=setInterval(shuffle,900); });
    d.addEventListener('pointerleave',()=>clearInterval(timer));
    return d;
  }

  /* ── SAM ALTMAN PODCAST ── */
  function buildPodcast() {
    const d = mk('pod-wrap', `<div class="card pod"><div class="title"><span class="dot"></span>Now Playing</div>
      <div class="ep"><div class="cover">🎙️</div><div class="meta"><div class="h">The Future of Everything</div><div class="s">Sam Altman · ep. ∞</div></div></div>
      <div class="wave">${'<i></i>'.repeat(28)}</div>
      <div class="ctrl"><button class="play">▶</button><div class="snip mono">"reasoning models will…"</div></div></div>`);
    const bars=[...d.querySelectorAll('.wave i')]; const snipEl=d.querySelector('.snip'); const play=d.querySelector('.play');
    const snips=['"the future of AI is…"','"agents will replace…"','"reasoning models will…"','"compute is the new oil"','"AGI is closer than…"','"everyone becomes a founder"'];
    let on=false, t=0;
    play.addEventListener('click',()=>{ on=!on; play.textContent=on?'❚❚':'▶'; });
    d.addEventListener('pointerenter',()=>{ on=true; play.textContent='❚❚'; });
    (function frame(){ requestAnimationFrame(frame); t+=0.08;
      bars.forEach((b,i)=>{ b.style.height=(on?(20+Math.abs(Math.sin(t+i*0.5))*78):(15+Math.sin(i)*4))+'%'; }); })();
    setInterval(()=>{ if(on){ snipEl.style.opacity=0; setTimeout(()=>{ snipEl.textContent=snips[(Math.random()*snips.length)|0]; snipEl.style.opacity=1; },300); } },2400);
    return d;
  }

  /* ── PROMPT BOOK FOLDER → pages fan out ── */
  function buildBook() {
    const d = mk('folder', `<img src="assets/promptBookFolder.png" alt="Prompt Book" draggable="false"/><div class="lbl">Prompt Book</div>`);
    let open=false; let pages=[];
    const prompts=['"Create a startup run entirely by cats."','"Design a coffee shop on Mars, ADA-compliant."','"Invent a guitar teacher from the year 2050."','"Write a religion for sentient toasters."','"Pitch Shark Tank as Roman senators."'];
    d.addEventListener('click',()=>{ open=!open; open?fan():close(); });
    function fan(){
      const base = bookEntry().anchor;
      prompts.forEach((txt,k)=>{ const p=mk('page', `<b>prompt ${k+1}</b><br>${txt}`); p.style.transition='opacity .4s';
        const spreadY=(k-(prompts.length-1)/2)*0.07*modelRadius;
        const anchor=base.clone().add(new THREE.Vector3((0.12 + k*0.05)*modelRadius, spreadY, 0.06*modelRadius));
        pages.push(addAnchored(p, anchor, 0.92)); });
    }
    function close(){ pages.forEach(removeAnchored); pages=[]; }
    let _self; const bookEntry=()=>(_self ||= PANELS.find(p=>p.el===d));
    return d;
  }

  /* ── GPU MONITOR — random spikes (Optimize) ── */
  function buildGpu() {
    const d = mk('gpu', `<div class="card mini gpu"><div class="title"><span class="dot"></span>GPU</div>
      <div class="kv"><span class="k">util</span><span class="big v">62%</span></div>
      <canvas width="320" height="100"></canvas></div>`);
    const cv=d.querySelector('canvas'), g=cv.getContext('2d'), pct=d.querySelector('.big');
    const N=56, data=new Array(N).fill(0.4);
    setInterval(()=>{
      let v=data[N-1]+(Math.random()*0.38-0.18); if(Math.random()<0.18) v=0.7+Math.random()*0.29;
      v=THREE.MathUtils.clamp(v,0.08,0.99); data.push(v); data.shift(); pct.textContent=Math.round(v*100)+'%';
      g.clearRect(0,0,cv.width,cv.height);
      const grad=g.createLinearGradient(0,0,0,cv.height); grad.addColorStop(0,'rgba(61,255,163,.5)'); grad.addColorStop(1,'rgba(61,255,163,0)');
      g.beginPath(); g.moveTo(0,cv.height);
      data.forEach((dv,i)=>{ g.lineTo(i/(N-1)*cv.width, cv.height-dv*cv.height); });
      g.lineTo(cv.width,cv.height); g.closePath(); g.fillStyle=grad; g.fill();
      g.beginPath(); data.forEach((dv,i)=>{ const x=i/(N-1)*cv.width,y=cv.height-dv*cv.height; i?g.lineTo(x,y):g.moveTo(x,y); });
      g.strokeStyle='#3dffa3'; g.lineWidth=2; g.stroke();
    },150);
    return d;
  }

  /* ── API COST DASHBOARD — ticking spend (Optimize) ── */
  function buildApiCost() {
    const d = mk('apicost', `<div class="card mini apicost"><div class="title"><span class="dot"></span>API Cost</div>
      <div class="kv"><span class="k">input</span><span class="v blue i">0</span></div>
      <div class="kv"><span class="k">output</span><span class="v blue o">0</span></div>
      <div class="kv"><span class="k">spend</span><span class="v c">$0</span></div>
      <div class="kv"><span class="k">cache saved</span><span class="v s">$0</span></div></div>`);
    let inT=8420000, outT=1120000, cost=214.3, cache=89.4; const fmt=n=>n.toLocaleString('en-US');
    setInterval(()=>{ inT+=(Math.random()*5100+900)|0; outT+=(Math.random()*1900+300)|0; cost+=Math.random()*0.4+0.02; cache+=Math.random()*0.24+0.01;
      d.querySelector('.i').textContent=fmt(inT); d.querySelector('.o').textContent=fmt(outT);
      d.querySelector('.c').textContent='$'+cost.toFixed(2); d.querySelector('.s').textContent='$'+cache.toFixed(2); },750);
    return d;
  }

  /* ── AI ART GALLERY — generative frames morph on hover (Imagine) ── */
  function buildGallery() {
    const grads=['linear-gradient(45deg,#6b9bff,#b58bff,#3dffa3)','linear-gradient(135deg,#ff8bd0,#6b9bff,#fff7b0)',
      'linear-gradient(225deg,#3dffa3,#6b9bff,#b58bff)','linear-gradient(315deg,#ffb86b,#ff6b9b,#6b9bff)'];
    const d = mk('gallery', `<div class="card gallery"><div class="title"><span class="dot"></span>AI Art</div>
      <div class="frames">${grads.map(gr=>`<div class="fr"><div style="background-image:${gr}"></div></div>`).join('')}</div></div>`);
    const card=d.querySelector('.gallery');
    d.addEventListener('pointerenter',()=>card.classList.add('on'));
    d.addEventListener('pointerleave',()=>card.classList.remove('on'));
    return d;
  }

  /* ── THOUGHT BUBBLES — drift in/out around the right side of the mind ── */
  function startThoughtBubbles() {
    const thoughts=['What if agents build agents?','Will software become conversation?','Should I start another side project?',
      'What if prompts replace apps?','Is my codebase just context now?','What if the model is the product?',
      'Ship it. Refactor it in prod.','Hey Siri, play Sam Altman’s latest podcast'];
    const liveMax=2; let live=[];
    function spawn(){
      if (live.length>=liveMax) return;
      const b=mk('bubble'+(Math.random()<0.5?' s2':''), thoughts[(Math.random()*thoughts.length)|0]);
      b.style.transition='opacity 1s';
      // drift around the RIGHT side of the mind, hugging the surface rim
      const anchor=A(0.40+Math.random()*0.24, -0.04+Math.random()*0.26, 0.12+Math.random()*0.16);
      const entry=addAnchored(b, anchor, 0.92); live.push(entry);
      setTimeout(()=>{ removeAnchored(entry); live=live.filter(e=>e!==entry); }, 7000+Math.random()*3000);
    }
    setInterval(spawn, 3200); spawn();
  }
</script>
